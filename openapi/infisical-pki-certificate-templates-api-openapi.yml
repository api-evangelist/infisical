  /api/v1/pki/certificate-templates:
    post:
      tags:
      - PKI Certificate Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caId:
                  type: string
                  description: The ID of the certificate authority to associate the template with.
                pkiCollectionId:
                  type: string
                  description: The ID of the PKI collection to bind to the template.
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The name of the template.
                commonName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The regular expression string to use for validating common names.
                subjectAlternativeName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The regular expression string to use for validating subject alternative names.
                ttl:
                  type: string
                  description: The max TTL for the template.
                keyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - digitalSignature
                    - keyEncipherment
                    - nonRepudiation
                    - dataEncipherment
                    - keyAgreement
                    - keyCertSign
                    - cRLSign
                    - encipherOnly
                    - decipherOnly
                  default:
                  - digitalSignature
                  - keyEncipherment
                  description: The key usage constraint or default value for when template is used during certificate issuance.
                extendedKeyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - clientAuth
                    - serverAuth
                    - codeSigning
                    - emailProtection
                    - timeStamping
                    - ocspSigning
                  default: []
                  description: The extended key usage constraint or default value for when template is used during certificate issuance.
              required:
              - caId
              - name
              - commonName
              - subjectAlternativeName
              - ttl
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  caId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  commonName:
                    type: string
                  subjectAlternativeName:
                    type: string
