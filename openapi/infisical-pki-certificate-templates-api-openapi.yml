    patch:
      tags:
      - PKI Certificate Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caId:
                  type: string
                  description: The ID of the certificate authority to update the association with the template.
                pkiCollectionId:
                  type: string
                  description: The ID of the PKI collection to update the binding to the template.
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The updated name of the template.
                commonName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The updated regular expression string for validating common names.
                subjectAlternativeName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The updated regular expression string for validating subject alternative names.
                ttl:
                  type: string
                  description: The updated max TTL for the template.
                keyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - digitalSignature
                    - keyEncipherment
                    - nonRepudiation
                    - dataEncipherment
                    - keyAgreement
                    - keyCertSign
                    - cRLSign
                    - encipherOnly
                    - decipherOnly
                  description: The updated key usage constraint or default value for when template is used during certificate issuance.
                extendedKeyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - clientAuth
                    - serverAuth
                    - codeSigning
                    - emailProtection
                    - timeStamping
                    - ocspSigning
                  description: The updated extended key usage constraint or default value for when template is used during certificate issuance.
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: certificateTemplateId
        required: true
        description: The ID of the certificate template to update.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  caId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  commonName:
                    type: string
                  subjectAlternativeName:
