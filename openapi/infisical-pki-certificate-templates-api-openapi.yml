  /api/v1/pki/certificate-templates/{certificateTemplateId}/est-config:
    post:
      tags:
      - PKI Certificate Templates
      description: Create Certificate Template EST configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caChain:
                  type: string
                passphrase:
                  type: string
                  minLength: 1
                isEnabled:
                  type: boolean
                  default: true
                disableBootstrapCertValidation:
                  type: boolean
                  default: false
              required:
              - passphrase
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: certificateTemplateId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  certificateTemplateId:
                    type: string
                    format: uuid
                  isEnabled:
                    type: boolean
                  disableBootstrapCertValidation:
