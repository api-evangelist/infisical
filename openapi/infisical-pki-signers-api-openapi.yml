paths:
  /api/v1/cert-manager/signers:
    post:
      operationId: createSigner
      tags:
      - PKI Signers
      description: Create a code signing signer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                description:
                  type: string
                  maxLength: 256
                caId:
                  type: string
                  format: uuid
                commonName:
                  type: string
                  minLength: 1
                  maxLength: 256
                certificateTtlDays:
                  type: integer
                  minimum: 1
                  maximum: 3650
                certificateRenewBeforeDays:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 30
                keyAlgorithm:
                  type: string
                  enum:
                  - RSA_2048
                  - RSA_3072
                  - RSA_4096
                  - EC_prime256v1
                  - EC_secp384r1
                  - EC_secp521r1
                certificateId:
                  type: string
                  format: uuid
                approvalPolicyId:
                  type: string
                  format: uuid
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - user
                        - identity
                        - group
                      id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        minLength: 1
                    required:
                    - kind
                    - id
                    - role
                    additionalProperties: false
                approvalPolicy:
                  type: object
                  properties:
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          stepNumber:
                            type: integer
                            minimum: 1
                          name:
                            type:
                            - string
                            - 'null'
                            maxLength: 64
                          requiredApprovals:
                            type: integer
                            minimum: 1
                          approverUserIds:
                            type: array
                            items:
                              type: string
                              format: uuid
                            default: []
                          approverGroupIds:
                            type: array
                            items:
                              type: string
                              format: uuid
                            default: []
                        required:
                        - stepNumber
                        - requiredApprovals
                        additionalProperties: false
                    constraints:
                      type: object
                      properties:
                        maxSignings:
                          type:
                          - integer
                          - 'null'
                          minimum: 1
                        maxWindowDuration:
                          type:
                          - string
                          - 'null'
                      additionalProperties: false
                  required:
                  - steps
                  additionalProperties: false
              required:
              - name
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  status:
                    type: string
                    default: active
                  certificateId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  approvalPolicyId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  lastSignedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  caId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  commonName:
                    type:
                    - string
                    - 'null'
                  certificateTtlDays:
                    type:
                    - number
                    - 'null'
                  certificateRenewBeforeDays:
                    type:
                    - number
                    - 'null'
                  certificateFailureReason:
                    type:
                    - string
                    - 'null'
                  keyAlgorithm:
                    type: string
                    default: RSA_2048
                required:
                - id
                - name
                - createdAt
                - updatedAt
                additionalProperties: false
        '400':
          description: Default Response
          content:
