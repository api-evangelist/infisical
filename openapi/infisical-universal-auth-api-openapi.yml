  /api/v1/auth/universal-auth/identities/{identityId}/client-secrets:
    post:
      operationId: createUniversalAuthClientSecret
      tags:
      - Universal Auth
      description: Create Universal Auth Client Secret for machine identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  default: ''
                  description: The description of the client secret.
                numUsesLimit:
                  type: number
                  minimum: 0
                  default: 0
                  description: The maximum number of times that the client secret can be used; a value of 0 implies infinite number of uses.
                ttl:
                  type: number
                  minimum: 0
                  maximum: 315360000
                  default: 0
                  description: The lifetime for the client secret in seconds.
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to create a client secret for.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
