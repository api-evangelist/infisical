    post:
      operationId: createSharedSecret
      tags:
      - Secret Sharing
      description: Create a new shared secret that can be accessed by a link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: An optional name for the shared secret for easier identification.
                password:
                  type: string
                  description: An optional password to protect the shared secret. Recipients will need to provide this password to access the secret.
                secretValue:
                  type: string
                  maxLength: 10000
                  description: The secret value to share.
                expiresIn:
                  type: string
                  default: 30d
                  description: The duration after which the shared secret will expire. Accepts formats like '30d', '24h', '1w'. Maximum is 30 days, minimum is 5 minutes.
                maxViews:
                  type: number
                  minimum: 1
                  description: The maximum number of times the shared secret can be viewed before it expires. If not provided, unlimited views are allowed.
                accessType:
                  type: string
                  enum:
                  - anyone
                  - organization
                  default: organization
                  description: Determines who can access the shared secret. 'organization' restricts access to users within your organization. 'anyone' allows access to anyone with the link. Defaults to 'organization'.
                authorizedEmails:
                  type: array
                  items:
                    type: string
                    format: email
                  maxItems: 100
                  description: An optional array of email addresses to share the secret with. Maximum 100 emails. Organization members in the list get direct access. When allowExternalEmails is enabled, non-member emails are also accepted and recipients will receive the secret link via email, but must use the password to access it.
                allowExternalEmails:
                  type: boolean
                  description: When true, allows sharing with email addresses that do not belong to Infisical. A password is required when this option is enabled. External recipients will receive the secret link via email and must enter the password to access it.
              required:
              - secretValue
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  userId:
                    type: string
                    format: uuid
                    nullable: true
                  orgId:
                    type: string
                    format: uuid
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  expiresAfterViews:
                    type: number
                    nullable: true
                  accessType:
                    type: string
                    default: anyone
                  name:
                    type: string
                    nullable: true
                  lastViewedAt:
                    type: string
                    format: date-time
                    nullable: true
                  type:
                    type: string
                    default: share
                  authorizedEmails:
                    nullable: true
                  identityId:
                    type: string
                    format: uuid
                    nullable: true
                  allowExternalEmails:
                    type: boolean
                    default: false
                    nullable: true
                  sharedSecretLink:
                    type: string
                required:
                - id
                - expiresAt
                - createdAt
                - updatedAt
                - sharedSecretLink
                additionalProperties: false
        '400':
          description: Default Response
          content:
