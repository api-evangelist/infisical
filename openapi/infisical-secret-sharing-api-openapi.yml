  /api/v1/shared-secrets/{id}/access:
    post:
      operationId: accessSharedSecret
      tags:
      - Secret Sharing
      description: Access a shared secret by its ID. If the secret is password protected, you must provide the password in the request body. Returns the secret value if access is granted, or an error if access is denied. The endpoint requires authentication if the shared secret is scoped to an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The password for accessing a password-protected shared secret. Only required if the secret is password protected.
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: The ID of the shared secret to access.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
