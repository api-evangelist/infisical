openapi: 3.0.3
info:
  title: Infisical Admin Secret Sharing API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Secret Sharing
paths:
  /api/v1/shared-secrets:
    get:
      operationId: listSharedSecrets
      tags:
      - Secret Sharing
      description: List all shared secrets created by the authenticated user or identity in their current organization.
      parameters:
      - schema:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        in: query
        name: offset
        required: false
        description: The offset to start listing shared secrets from. Used for pagination.
      - schema:
          type: number
          minimum: 1
          maximum: 100
          default: 25
        in: query
        name: limit
        required: false
        description: The maximum number of shared secrets to return. Max is 100.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        expiresAt:
                          type: string
                          format: date-time
                        userId:
                          type: string
                          format: uuid
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        expiresAfterViews:
                          type: number
                          nullable: true
                        accessType:
                          type: string
                          default: anyone
                        name:
                          type: string
                          nullable: true
                        lastViewedAt:
                          type: string
                          format: date-time
                          nullable: true
                        type:
                          type: string
                          default: share
                        authorizedEmails:
                          nullable: true
                        identityId:
                          type: string
                          format: uuid
                          nullable: true
                        allowExternalEmails:
                          type: boolean
                          default: false
                          nullable: true
                      required:
                      - id
                      - expiresAt
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - secrets
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
