                    format: uuid
                    nullable: true
                  orgId:
                    type: string
                    format: uuid
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  expiresAfterViews:
                    type: number
                    nullable: true
                  accessType:
                    type: string
                    default: anyone
                  name:
                    type: string
                    nullable: true
                  lastViewedAt:
                    type: string
                    format: date-time
                    nullable: true
                  type:
                    type: string
                    default: share
                  authorizedEmails:
                    nullable: true
                  identityId:
                    type: string
                    format: uuid
                    nullable: true
                  allowExternalEmails:
                    type: boolean
                    default: false
                    nullable: true
                  orgName:
                    type: string
                  secretValue:
