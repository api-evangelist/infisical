    get:
      operationId: getTokenAuthTokens
      tags:
      - Token Auth
      description: Get tokens for machine identity with Token Auth
      parameters:
      - schema:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        in: query
        name: offset
        required: false
        description: The offset to start from. If you enter 10, it will start from the 10th token.
      - schema:
          type: number
          minimum: 1
          maximum: 100
          default: 20
        in: query
        name: limit
        required: false
        description: The number of tokens to return.
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to list token metadata for.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        accessTokenTTL:
                          type: number
                          default: 2592000
                        accessTokenMaxTTL:
                          type: number
