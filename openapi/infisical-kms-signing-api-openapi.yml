                  - ECDSA_SHA_256
                  - ED25519
                  - ML_DSA_44
                  - ML_DSA_65
                  - ML_DSA_87
              required:
              - data
              - signature
              - signingAlgorithm
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: keyId
        required: true
        description: The ID of the key to verify the data with.
      responses:
        '200':
          description: Default Response
