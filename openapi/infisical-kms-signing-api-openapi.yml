  /api/v1/kms/keys/{keyId}/sign:
    post:
      operationId: signWithKmsKey
      tags:
      - KMS Signing
      description: Sign data with a KMS key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signingAlgorithm:
                  type: string
                  enum:
                  - RSASSA_PSS_SHA_512
                  - RSASSA_PSS_SHA_384
                  - RSASSA_PSS_SHA_256
                  - RSASSA_PKCS1_V1_5_SHA_512
                  - RSASSA_PKCS1_V1_5_SHA_384
                  - RSASSA_PKCS1_V1_5_SHA_256
                  - ECDSA_SHA_512
                  - ECDSA_SHA_384
                  - ECDSA_SHA_256
                  - ED25519
                  - ML_DSA_44
                  - ML_DSA_65
                  - ML_DSA_87
                isDigest:
                  type: boolean
                  default: false
                  description: Whether the data is already digested or not. Please be aware that if you are passing a digest the algorithm used to create the digest must match the signing algorithm used to sign the digest.
                data:
                  type: string
                  description: The data in string format to be signed (base64 encoded).
              required:
              - signingAlgorithm
              - data
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: keyId
        required: true
        description: The ID of the key to sign the data with.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: string
                  keyId:
                    type: string
                    format: uuid
                  signingAlgorithm:
                    type: string
                    enum:
                    - RSASSA_PSS_SHA_512
                    - RSASSA_PSS_SHA_384
                    - RSASSA_PSS_SHA_256
                    - RSASSA_PKCS1_V1_5_SHA_512
                    - RSASSA_PKCS1_V1_5_SHA_384
                    - RSASSA_PKCS1_V1_5_SHA_256
                    - ECDSA_SHA_512
                    - ECDSA_SHA_384
                    - ECDSA_SHA_256
                    - ED25519
                    - ML_DSA_44
