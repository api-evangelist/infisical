                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        profileCount:
                          type: integer
                          minimum: 0
                        memberCount:
                          type: integer
                          minimum: 0
                        certificateCount:
                          type: integer
                          minimum: 0
