  /api/v2/identities/search:
    post:
      operationId: searchMachineIdentitiesV2
      tags:
      - Identities
      description: Search machine identities across organization and/or project scopes. Returns identities the caller has access to, each annotated with all roles assigned to that membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    enum:
                    - organization
                    - project
                  minItems: 1
                  default:
                  - organization
                  description: Array of scopes to search across. Accepts 'organization' to include organization-level identities and/or 'project' to include identities from projects the caller has access to. Defaults to ['organization'].
                orderBy:
                  type: string
                  enum:
                  - name
                  - role
                  - lastLogin
                  default: name
                  description: The column to order identities by.
                orderDirection:
                  type: string
                  enum:
                  - asc
                  - desc
                  default: asc
                  description: The direction to order identities in.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: The number of identities to return.
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                  description: The offset to start from. If you enter 10, it will start from the 10th identity.
                search:
                  type: object
                  properties:
                    name:
                      anyOf:
                      - type: string
                        maxLength: 255
                      - type: object
                        properties:
                          $eq:
                            type: string
                            maxLength: 255
                          $contains:
                            type: string
                            maxLength: 255
                          $in:
                            type: array
                            items:
                              type: string
                              maxLength: 255
                        additionalProperties: false
                      description: The name of the identity to filter by.
                    role:
                      anyOf:
                      - type: string
                        maxLength: 255
                      - type: object
                        properties:
                          $eq:
                            type: string
                            maxLength: 255
                          $contains:
                            type: string
                            maxLength: 255
                          $in:
                            type: array
                            items:
                              type: string
                              maxLength: 255
                        additionalProperties: false
                      description: The role to filter by. Matches against the role name or slug for custom roles and the role type for predefined roles.
                    $or:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            anyOf:
                            - type: string
                              maxLength: 255
                            - type: object
                              properties:
                                $eq:
                                  type: string
                                  maxLength: 255
                                $contains:
                                  type: string
                                  maxLength: 255
                                $in:
                                  type: array
                                  items:
                                    type: string
                                    maxLength: 255
                              additionalProperties: false
                            description: The name of the identity to filter by.
                          role:
                            anyOf:
                            - type: string
                              maxLength: 255
                            - type: object
                              properties:
                                $eq:
                                  type: string
                                  maxLength: 255
                                $contains:
                                  type: string
                                  maxLength: 255
                                $in:
                                  type: array
                                  items:
                                    type: string
                                    maxLength: 255
                              additionalProperties: false
                            description: The role to filter by. Matches against the role name or slug for custom roles and the role type for predefined roles.
                        additionalProperties: false
                        description: The filters to apply to the search.
                      maxItems: 5
                  additionalProperties: false
                  description: The filters to apply to the search.
              additionalProperties: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        identityId:
                          type: string
                        scope:
                          type: string
                          enum:
                          - organization
                          - project
                        orgId:
                          type: string
                        projectId:
                          type: string
                          nullable: true
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            slug:
                              type: string
                            type:
                              type: string
                          required:
                          - id
                          - name
                          - slug
                          - type
                          additionalProperties: false
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        lastLoginAuthMethod:
                          type: string
                          nullable: true
                        lastLoginTime:
                          type: string
                          format: date-time
                          nullable: true
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              role:
                                type: string
                              customRoleId:
                                type: string
                                nullable: true
                              customRoleName:
                                type: string
                                nullable: true
                              customRoleSlug:
                                type: string
                                nullable: true
                              customRoleDescription:
                                type: string
                                nullable: true
                              isTemporary:
                                type: boolean
                              temporaryMode:
                                type: string
                                nullable: true
                              temporaryRange:
                                type: string
                                nullable: true
                              temporaryAccessStartTime:
                                type: string
                                format: date-time
                                nullable: true
