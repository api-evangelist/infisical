  /api/v1/identities:
    post:
      operationId: createMachineIdentity
      tags:
      - Identities
      description: Create machine identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the identity to create.
                organizationId:
                  type: string
                  description: The organization ID to which the identity belongs.
                role:
                  type: string
                  minLength: 1
                  default: no-access
                  description: The role of the identity. Possible values are 'no-access', 'member', and 'admin'.
                hasDeleteProtection:
                  type: boolean
                  default: false
                  description: Prevents deletion of the identity when enabled.
                metadata:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        minLength: 1
                      value:
                        type: string
                        minLength: 1
                    required:
                    - key
                    - value
                    additionalProperties: false
              required:
              - name
              - organizationId
              additionalProperties: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      authMethod:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      hasDeleteProtection:
                        type: boolean
                        default: false
                      orgId:
                        type: string
                        format: uuid
                      projectId:
                        type: string
                        nullable: true
                      authMethods:
                        type: array
                        items:
                          type: string
                      metadata:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            key:
                              type: string
                            value:
                              type: string
                          required:
                          - id
                          - key
                          - value
                          additionalProperties: false
                    required:
                    - id
                    - name
                    - createdAt
                    - updatedAt
                    - orgId
                    - authMethods
                    - metadata
                    additionalProperties: false
                required:
                - identity
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
