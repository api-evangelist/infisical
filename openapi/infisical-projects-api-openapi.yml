  /api/v1/projects:
    post:
      operationId: createProject
      tags:
      - Projects
      description: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectName:
                  type: string
                  maxLength: 64
                  description: The name of the project to create.
                projectDescription:
                  type: string
                  maxLength: 1024
                  description: An optional description label for the project.
                slug:
                  type: string
                  minLength: 5
                  maxLength: 64
                  description: An optional slug for the project.
                kmsKeyId:
                  type: string
                template:
                  type: string
                  minLength: 1
                  maxLength: 64
                  default: default
                  description: The name of the project template, if specified, to apply to this project.
                type:
                  type: string
                  enum:
                  - secret-manager
                  - cert-manager
                  - kms
                  - secret-scanning
                  - pam
                  - agent-vault
                  default: secret-manager
                shouldCreateDefaultEnvs:
                  type: boolean
                  default: true
                hasDeleteProtection:
                  type: boolean
                  default: false
              required:
              - projectName
              additionalProperties: false
