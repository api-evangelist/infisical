                  - cert-manager
                  - kms
                  - secret-scanning
                  - pam
                  - agent-vault
                  description: The default product in which the project will open
                secretDetectionIgnoreValues:
                  type: array
                  items:
                    type: string
                  description: The list of secret values to ignore for secret detection.
              additionalProperties: false
