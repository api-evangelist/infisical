                searchBase:
                  type: string
                  minLength: 1
                  description: The new base DN to search for the LDAP user.
                templateId:
                  type: string
                  description: The ID of the identity auth template to update the configuration to.
                searchFilter:
                  type: string
                  minLength: 1
                  description: The new filter to use to search for the LDAP user.
                allowedFields:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    additionalProperties: false
                  description: The comma-separated list of allowed fields to return from the LDAP user.
                accessTokenTrustedIps:
                  type: array
                  items:
                    type: object
                    properties:
                      ipAddress:
                        type: string
                    required:
