  /api/v1/auth/ldap-auth/identities/{identityId}:
    post:
      operationId: attachLdapAuth
      tags:
      - LDAP Auth
      description: Attach LDAP Auth configuration onto machine identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  templateId:
                    type: string
                    description: The ID of the identity auth template to attach the configuration onto.
                  searchFilter:
                    type: string
                    minLength: 1
                    default: (uid={{username}})
                    description: The filter to use to search for the LDAP user.
                  allowedFields:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                      required:
                      - key
                      - value
                      additionalProperties: false
                    description: The comma-separated array of key/value pairs of required fields that the LDAP entry must have in order to authenticate.
                  ldapCaCertificate:
                    type: string
                    description: The PEM-encoded CA certificate for the LDAP server.
                  accessTokenTrustedIps:
                    type: array
                    items:
                      type: object
                      properties:
                        ipAddress:
                          type: string
                      required:
                      - ipAddress
                      additionalProperties: false
                    minItems: 1
                    default:
                    - ipAddress: 0.0.0.0/0
                    - ipAddress: ::/0
                    description: The IPs or CIDR ranges that access tokens can be used from.
                  accessTokenTTL:
                    type: integer
                    minimum: 0
                    maximum: 315360000
                    default: 2592000
                    description: The lifetime for an access token in seconds.
                  accessTokenMaxTTL:
                    type: integer
                    minimum: 1
                    maximum: 315360000
                    default: 2592000
                    description: The maximum lifetime for an access token in seconds.
                  accessTokenNumUsesLimit:
                    type: integer
                    minimum: 0
                    default: 0
                    description: The maximum number of times that an access token can be used.
                  lockoutEnabled:
                    type: boolean
                    default: true
                    description: Whether the lockout feature is enabled.
                  lockoutThreshold:
                    type: number
                    minimum: 1
                    maximum: 30
                    default: 3
                    description: The amount of times login must fail before locking the identity auth method.
                  lockoutDurationSeconds:
                    type: number
                    minimum: 30
                    maximum: 86400
                    default: 300
                    description: How long an identity auth method lockout lasts.
                  lockoutCounterResetSeconds:
                    type: number
                    minimum: 5
                    maximum: 3600
                    default: 30
                    description: How long to wait from the most recent failed login until resetting the lockout counter.
                required:
                - templateId
                additionalProperties: false
              - type: object
                properties:
                  url:
                    type: string
                    description: The URL of the LDAP server.
                  bindDN:
                    type: string
                    description: The DN of the user to bind to the LDAP server.
                  bindPass:
                    type: string
                    description: The password of the user to bind to the LDAP server.
                  searchBase:
                    type: string
                    description: The base DN to search for the LDAP user.
                  searchFilter:
                    type: string
                    minLength: 1
                    default: (uid={{username}})
                    description: The filter to use to search for the LDAP user.
                  allowedFields:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                      required:
                      - key
                      - value
                      additionalProperties: false
                    description: The comma-separated array of key/value pairs of required fields that the LDAP entry must have in order to authenticate.
                  ldapCaCertificate:
                    type: string
                    description: The PEM-encoded CA certificate for the LDAP server.
                  accessTokenTrustedIps:
                    type: array
                    items:
                      type: object
                      properties:
                        ipAddress:
                          type: string
                      required:
                      - ipAddress
                      additionalProperties: false
                    minItems: 1
                    default:
                    - ipAddress: 0.0.0.0/0
                    - ipAddress: ::/0
                    description: The IPs or CIDR ranges that access tokens can be used from.
                  accessTokenTTL:
                    type: integer
                    minimum: 0
                    maximum: 315360000
                    default: 2592000
                    description: The lifetime for an access token in seconds.
                  accessTokenMaxTTL:
                    type: integer
                    minimum: 1
                    maximum: 315360000
                    default: 2592000
                    description: The maximum lifetime for an access token in seconds.
                  accessTokenNumUsesLimit:
                    type: integer
                    minimum: 0
                    default: 0
                    description: The maximum number of times that an access token can be used.
                  lockoutEnabled:
                    type: boolean
                    default: true
                    description: Whether the lockout feature is enabled.
                  lockoutThreshold:
                    type: number
                    minimum: 1
                    maximum: 30
                    default: 3
                    description: The amount of times login must fail before locking the identity auth method.
                  lockoutDurationSeconds:
                    type: number
                    minimum: 30
                    maximum: 86400
                    default: 300
                    description: How long an identity auth method lockout lasts.
                  lockoutCounterResetSeconds:
                    type: number
                    minimum: 5
                    maximum: 3600
                    default: 30
                    description: How long to wait from the most recent failed login until resetting the lockout counter.
                required:
                - url
                - bindDN
                - bindPass
                - searchBase
                additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to attach the configuration onto.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityLdapAuth:
