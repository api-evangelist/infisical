  /api/v1/pki/subscribers:
    post:
      operationId: createPkiSubscriber
      tags:
      - PKI Subscribers
      description: Create PKI Subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: The ID of the project to create the PKI subscriber in.
                caId:
                  type: string
                  format: uuid
                  minLength: 1
                  description: The ID of the CA that will issue certificates for the PKI subscriber.
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The name of the PKI subscriber.
                commonName:
                  type: string
                  minLength: 1
                  description: The common name (CN) to be used on certificates issued for this subscriber.
                status:
                  type: string
                  enum:
                  - active
                  - disabled
                  default: active
                  description: The status of the PKI subscriber. This can be one of active or disabled.
                ttl:
                  type: string
                  description: The time to live for the certificates issued for this subscriber such as 1m, 1h, 1d, 1y, ...
                subjectAlternativeNames:
                  type: array
                  items:
                    type: string
                  default: []
                  description: A list of Subject Alternative Names (SANs) to be used on certificates issued for this subscriber; these can be host names or email addresses.
                keyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - digitalSignature
                    - keyEncipherment
                    - nonRepudiation
                    - dataEncipherment
                    - keyAgreement
                    - keyCertSign
                    - cRLSign
                    - encipherOnly
                    - decipherOnly
                  default:
                  - digitalSignature
                  - keyEncipherment
                  description: The key usage extension to be used on certificates issued for this subscriber.
                extendedKeyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - clientAuth
                    - serverAuth
                    - codeSigning
                    - emailProtection
                    - timeStamping
                    - ocspSigning
                  default: []
                  description: The extended key usage extension to be used on certificates issued for this subscriber.
                enableAutoRenewal:
                  type: boolean
                  description: Whether or not to enable auto renewal for the PKI subscriber.
                autoRenewalPeriodInDays:
                  type: number
                  minimum: 1
                  description: The period in days to auto renew the PKI subscriber's certificates.
                properties:
                  type: object
                  properties:
                    azureTemplateType:
                      type: string
                      description: Azure ADCS Certificate Template Type
                    organization:
                      type: string
                      minLength: 1
                      maxLength: 64
                      allOf:
                      - pattern: ^[^,=+<>#;\\"\/\r\n\t]*$
                      - pattern: ^[^\\s\\-_.]+.*[^\\s\\-_.]+$|^[^\\s\\-_.]{1}$
                      description: Organization (O) - Maximum 64 characters, no special DN characters
                    organizationalUnit:
                      type: string
                      minLength: 1
                      maxLength: 64
                      allOf:
                      - pattern: ^[^,=+<>#;\\"\/\r\n\t]*$
                      - pattern: ^[^\\s\\-_.]+.*[^\\s\\-_.]+$|^[^\\s\\-_.]{1}$
                      description: Organizational Unit (OU) - Maximum 64 characters, no special DN characters
                    country:
                      type: string
                      minLength: 2
                      maxLength: 2
                      pattern: ^[A-Z]{2}$
                      description: Country (C) - Two uppercase letter country code (e.g., US, CA, GB)
                    state:
                      type: string
                      minLength: 1
                      maxLength: 64
                      allOf:
                      - pattern: ^[^,=+<>#;\\"\/\r\n\t]*$
