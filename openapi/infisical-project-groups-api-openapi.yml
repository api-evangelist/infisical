      tags:
      - Project Groups
      description: 'Deprecated: Use POST /api/v1/projects/:projectId/memberships/groups/:groupId instead. Add group to project.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  minLength: 1
                  default: no-access
                  description: The role for the group to assume in the project.
                roles:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        role:
                          type: string
                        isTemporary:
                          type: boolean
                          enum:
                          - false
                          default: false
                      required:
                      - role
                      additionalProperties: false
                    - type: object
                      properties:
                        role:
                          type: string
                        isTemporary:
                          type: boolean
                          enum:
                          - true
                        temporaryMode:
                          type: string
                          enum:
                          - relative
                        temporaryRange:
                          type: string
                        temporaryAccessStartTime:
                          type: string
                          format: date-time
                      required:
                      - role
                      - isTemporary
                      - temporaryMode
                      - temporaryRange
                      - temporaryAccessStartTime
                      additionalProperties: false
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: projectId
        required: true
        description: The ID of the project to add the group to.
      - schema:
          type: string
        in: path
        name: groupIdOrName
        required: true
        description: The ID or name of the group to add to the project.
      deprecated: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupMembership:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      projectId:
                        type: string
                      groupId:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                    - id
                    - projectId
                    - groupId
                    - createdAt
                    - updatedAt
                    additionalProperties: false
                required:
