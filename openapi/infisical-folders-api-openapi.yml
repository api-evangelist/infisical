  /api/v1/folders/batch:
    patch:
      tags:
      - Folders
      description: Update folders by batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectSlug:
                  type: string
                  description: The slug of the project where the folder is located.
                folders:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The ID of the folder to update.
                      environment:
                        type: string
                        description: The slug of the environment where the folder is located.
                      name:
                        type: string
                        description: The new name of the folder.
                      path:
                        type: string
                        default: /
                        description: The path of the folder to update.
                      description:
                        type: string
                        nullable: true
                        description: An optional description label for the folder.
                    required:
                    - id
                    - environment
                    - name
                    additionalProperties: false
                  minItems: 1
              required:
              - projectSlug
              - folders
              additionalProperties: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
