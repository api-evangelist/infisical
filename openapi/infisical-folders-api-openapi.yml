openapi: 3.0.3
info:
  title: Infisical Admin Folders API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Folders
paths:
  /api/v1/folders:
    post:
      tags:
      - Folders
      description: Create folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  description: The ID of the project to create the folder in.
                environment:
                  type: string
                  description: The slug of the environment to create the folder in.
                name:
                  type: string
                  description: The name of the folder to create.
                path:
                  type: string
                  default: /
                  description: The path of the folder to create.
                directory:
                  type: string
                  default: /
                  description: The directory of the folder to create. (Deprecated in favor of path)
                description:
                  type: string
                  nullable: true
                  description: An optional description label for the folder.
              required:
              - workspaceId
              - environment
              - name
              additionalProperties: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      version:
                        type: number
                        default: 1
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      envId:
                        type: string
                        format: uuid
                      parentId:
                        type: string
                        format: uuid
                        nullable: true
                      isReserved:
                        type: boolean
                        default: false
                        nullable: true
                      description:
                        type: string
                        nullable: true
                      lastSecretModified:
                        type: string
                        format: date-time
                        nullable: true
                      path:
                        type: string
                    required:
                    - id
                    - name
                    - createdAt
                    - updatedAt
                    - envId
                    - path
                    additionalProperties: false
                required:
                - folder
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
