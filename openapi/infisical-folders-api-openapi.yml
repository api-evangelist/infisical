              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 500
                  message:
                    type: string
                  error:
                    type: string
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
    get:
      tags:
      - Folders
      description: Get folders
      parameters:
      - schema:
          type: string
        in: query
        name: workspaceId
        required: true
        description: The ID of the project to list folders from.
      - schema:
          type: string
        in: query
        name: environment
        required: true
        description: The slug of the environment to list folders from.
      - schema:
          type: string
          format: date-time
        in: query
        name: lastSecretModified
        required: false
        description: The timestamp used to filter folders with secrets modified after the specified date. The format for this timestamp is ISO 8601 (e.g. 2025-04-01T09:41:45-04:00)
      - schema:
          type: string
        in: query
        name: path
        required: false
        description: The path to list folders from.
      - schema:
          type: string
        in: query
        name: directory
        required: false
        description: The directory to list folders from. (Deprecated in favor of path)
      - schema:
          anyOf:
          - type: boolean
          - type: string
          default: false
        in: query
        name: recursive
        required: false
        description: Whether or not to fetch all folders from the specified base path, and all of its subdirectories.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        version:
                          type: number
                          default: 1
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        envId:
                          type: string
                          format: uuid
                        parentId:
                          type: string
                          format: uuid
                          nullable: true
                        isReserved:
                          type: boolean
                          default: false
                          nullable: true
                        description:
                          type: string
                          nullable: true
                        lastSecretModified:
                          type: string
                          format: date-time
                          nullable: true
                        relativePath:
                          type: string
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                      - envId
                      additionalProperties: false
                required:
                - folders
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
