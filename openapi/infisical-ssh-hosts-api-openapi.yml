    post:
      tags:
      - SSH Hosts
      description: Register SSH Host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: The ID of the project to create the SSH host in.
                hostname:
                  type: string
                  minLength: 1
                  description: The hostname of the SSH host.
                alias:
                  type: string
                  minLength: 0
                  maxLength: 64
                  description: The alias for the SSH host.
                  default: ''
                userCertTtl:
                  type: string
                  default: 8h
                  description: The time to live for user certificates issued under this host.
                hostCertTtl:
                  type: string
                  default: 1y
                  description: The time to live for host certificates issued under this host.
                loginMappings:
                  type: array
                  items:
                    type: object
                    properties:
                      loginUser:
                        type: string
                      allowedPrincipals:
                        type: object
                        properties:
                          usernames:
                            type: array
                            items:
                              type: string
                          groups:
                            type: array
                            items:
                              type: string
                        additionalProperties: false
                    required:
                    - loginUser
                    - allowedPrincipals
                    additionalProperties: false
                  default: []
                  description: A list of login mappings for the SSH host. Each login mapping contains a login user and a list of corresponding allowed principals being usernames of users or groups slugs in the Infisical SSH project.
                userSshCaId:
                  type: string
                  description: The ID of the SSH CA to use for user certificates. If not specified, the default user SSH CA will be used if it exists.
                hostSshCaId:
                  type: string
                  description: The ID of the SSH CA to use for host certificates. If not specified, the default host SSH CA will be used if it exists.
              required:
              - projectId
              - hostname
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                  hostname:
                    type: string
                  alias:
                    type: string
                    nullable: true
                  userCertTtl:
                    type: string
                  hostCertTtl:
                    type: string
                  userSshCaId:
                    type: string
                    format: uuid
                  hostSshCaId:
                    type: string
                    format: uuid
                  loginMappings:
                    type: array
                    items:
                      type: object
                      properties:
                        loginUser:
                          type: string
                        allowedPrincipals:
                          type: object
                          properties:
                            usernames:
                              type: array
                              items:
                                type: string
                            groups:
                              type: array
                              items:
                                type: string
                          additionalProperties: false
                        source:
                          type: string
                          enum:
                          - host
                          - hostGroup
                      required:
                      - loginUser
                      - allowedPrincipals
                      - source
                      additionalProperties: false
                required:
                - id
                - projectId
                - hostname
                - userCertTtl
                - hostCertTtl
                - userSshCaId
                - hostSshCaId
                - loginMappings
                additionalProperties: false
        '400':
          description: Default Response
