openapi: 3.0.3
info:
  title: Infisical Admin SSH Hosts API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: SSH Hosts
paths:
  /api/v1/ssh/hosts:
    get:
      tags:
      - SSH Hosts
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    projectId:
                      type: string
                    hostname:
                      type: string
                    alias:
                      type: string
                      nullable: true
                    userCertTtl:
                      type: string
                    hostCertTtl:
                      type: string
                    userSshCaId:
                      type: string
                      format: uuid
                    hostSshCaId:
                      type: string
                      format: uuid
                    loginMappings:
                      type: array
                      items:
                        type: object
                        properties:
                          loginUser:
                            type: string
                          allowedPrincipals:
                            type: object
                            properties:
                              usernames:
                                type: array
                                items:
                                  type: string
                              groups:
                                type: array
                                items:
                                  type: string
                            additionalProperties: false
                          source:
                            type: string
                            enum:
                            - host
                            - hostGroup
                        required:
                        - loginUser
                        - allowedPrincipals
                        - source
                        additionalProperties: false
                  required:
                  - id
                  - projectId
                  - hostname
                  - userCertTtl
                  - hostCertTtl
                  - userSshCaId
