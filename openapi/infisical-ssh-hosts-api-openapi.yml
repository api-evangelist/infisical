  /api/v1/ssh/hosts/{sshHostId}/issue-user-cert:
    post:
      tags:
      - SSH Hosts
      description: Issue SSH certificate for user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginUser:
                  type: string
                  description: The login user to issue the SSH credentials for.
              required:
              - loginUser
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: sshHostId
        required: true
        description: The ID of the SSH host to issue the SSH credentials for.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  serialNumber:
                    type: string
                    description: The serial number of the issued SSH certificate.
                  signedKey:
                    type: string
                    description: The SSH certificate or signed SSH public key.
                  privateKey:
                    type: string
                    description: The private key corresponding to the issued SSH certificate.
                  publicKey:
                    type: string
                    description: The public key of the issued SSH certificate.
                  keyAlgorithm:
                    type: string
                    enum:
                    - RSA_2048
                    - RSA_4096
                    - EC_prime256v1
                    - EC_secp384r1
                    - ED25519
                    description: The type of public key algorithm and size, in bits, of the key pair for the SSH host.
                required:
                - serialNumber
                - signedKey
                - privateKey
                - publicKey
                - keyAlgorithm
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 401
                  message:
