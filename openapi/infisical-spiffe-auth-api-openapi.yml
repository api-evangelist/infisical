  /api/v1/auth/spiffe-auth/identities/{identityId}:
    post:
      operationId: attachSpiffeAuth
      tags:
      - SPIFFE Auth
      description: Attach SPIFFE Auth configuration onto machine identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trustDomain:
                  type: string
                  minLength: 1
                  description: The SPIFFE trust domain (e.g. prod.example.com).
                allowedSpiffeIds:
                  type: string
                  minLength: 1
                  description: Comma-separated list of allowed SPIFFE ID patterns. Supports picomatch glob patterns (e.g. spiffe://prod.example.com/**).
                allowedAudiences:
                  type: string
                  minLength: 1
                  description: Comma-separated list of allowed audiences for JWT-SVID validation.
                trustBundleDistribution:
                  anyOf:
                  - type: object
                    properties:
                      profile:
                        type: string
                        enum:
                        - static
                        description: 'The trust bundle distribution profile. Must be one of: ''static'' (admin uploads JWKS), ''https_web_bundle'' (auto-refresh from HTTPS endpoint).'
                      bundle:
                        type: string
                        minLength: 1
                        description: The JWKS JSON containing public keys for JWT-SVID verification. Required when profile is 'static'.
                    required:
                    - profile
                    - bundle
                    additionalProperties: false
                  - type: object
                    properties:
                      profile:
                        type: string
                        enum:
                        - https_web_bundle
                        description: 'The trust bundle distribution profile. Must be one of: ''static'' (admin uploads JWKS), ''https_web_bundle'' (auto-refresh from HTTPS endpoint).'
                      endpointUrl:
                        type: string
                        format: uri
                        description: The SPIRE bundle endpoint URL for automatic trust bundle retrieval. Required when profile is 'https_web_bundle'.
                      caCert:
                        type: string
                        description: Optional PEM-encoded root CA certificate for verifying the bundle endpoint TLS connection. Defaults to system root CAs when not provided.
                      refreshHintSeconds:
                        type: integer
                        minimum: 0
                        default: 3600
                        description: The interval in seconds between bundle refresh attempts. Defaults to 3600.
                    required:
                    - profile
                    - endpointUrl
                    additionalProperties: false
                accessTokenTrustedIps:
                  type: array
                  items:
                    type: object
                    properties:
                      ipAddress:
                        type: string
                    required:
                    - ipAddress
                    additionalProperties: false
                  minItems: 1
                  default:
                  - ipAddress: 0.0.0.0/0
                  - ipAddress: ::/0
                  description: The IPs or CIDR ranges that access tokens can be used from.
                accessTokenTTL:
                  type: integer
                  minimum: 0
                  maximum: 315360000
                  default: 2592000
                  description: The lifetime for an access token in seconds.
                accessTokenMaxTTL:
                  type: integer
                  minimum: 0
                  maximum: 315360000
                  default: 2592000
                  description: The maximum lifetime for an access token in seconds.
                accessTokenNumUsesLimit:
                  type: integer
                  minimum: 0
                  default: 0
                  description: The maximum number of times that an access token can be used.
              required:
              - trustDomain
              - allowedSpiffeIds
              - allowedAudiences
              - trustBundleDistribution
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to attach the configuration onto.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identitySpiffeAuth:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      identityId:
                        type: string
                        format: uuid
                      trustDomain:
                        type: string
                      allowedSpiffeIds:
                        type: string
                      allowedAudiences:
                        type: string
                      accessTokenTTL:
                        type: number
                        default: 7200
                      accessTokenMaxTTL:
                        type: number
                        default: 7200
                      accessTokenNumUsesLimit:
                        type: number
                        default: 0
                      accessTokenTrustedIps: {}
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      trustBundleDistribution:
                        anyOf:
                        - type: object
                          properties:
                            profile:
                              type: string
                              enum:
                              - static
                            bundle:
                              type: string
                          required:
                          - profile
                          - bundle
                          additionalProperties: false
                        - type: object
                          properties:
                            profile:
                              type: string
                              enum:
                              - https_web_bundle
                            endpointUrl:
                              type: string
                            caCert:
                              type: string
                            refreshHintSeconds:
                              type: number
                            cachedBundleLastRefreshedAt:
                              type: string
                              format: date-time
                              nullable: true
                          required:
                          - profile
                          - endpointUrl
                          - caCert
                          - refreshHintSeconds
                          additionalProperties: false
                    required:
                    - id
                    - identityId
                    - trustDomain
                    - allowedSpiffeIds
                    - allowedAudiences
                    - createdAt
                    - updatedAt
                    - trustBundleDistribution
                    additionalProperties: false
                required:
                - identitySpiffeAuth
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 401
                  message:
                    type: string
                  error:
                    type: string
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 403
                  message:
                    type: string
                  details: {}
                  error:
                    type: string
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 404
                  message:
                    type: string
                  error:
                    type: string
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '422':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
