                  - SLH-DSA-SHAKE-256f
                  - SLH-DSA-SHAKE-256s
                  default: RSA_2048
                  description: The type of public key algorithm and size, in bits, of the key pair for the CA; when you create an intermediate CA, you must use a key algorithm supported by the parent CA.
                requireTemplateForIssuance:
                  type: boolean
                  default: false
                  description: Whether or not certificates for this CA can only be issued through certificate templates.
              required:
              - projectSlug
              - type
              - commonName
              - organization
              - ou
              - country
