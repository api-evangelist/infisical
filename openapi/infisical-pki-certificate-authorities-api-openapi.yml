                          type:
                            type: string
                            enum:
                            - internal
                          configuration:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - root
                                - intermediate
                                description: The type of CA to create.
                              friendlyName:
                                type: string
                                description: A friendly name for the CA.
                              commonName:
                                type: string
                                default: ''
                                description: The common name (CN) for the CA.
                              organization:
                                type: string
                                default: ''
                                description: The organization (O) for the CA.
                              ou:
                                type: string
                                default: ''
                                description: The organization unit (OU) for the CA.
                              country:
                                type: string
                                default: ''
                                description: The country name (C) for the CA.
                              province:
                                type: string
                                default: ''
