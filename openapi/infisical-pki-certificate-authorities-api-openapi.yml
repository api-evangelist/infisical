                      enum:
                      - acme
                    configuration:
                      type: object
                      properties:
                        dnsAppConnectionId:
                          type: string
                          format: uuid
                          description: The ID of the App Connection to use for creating and managing DNS TXT records required for ACME domain validation. This connection must have permissions to create and delete TXT records in your DNS provider (e.g., Route53) for the ACME challenge process.
                        dnsProviderConfig:
                          type: object
                          properties:
                            provider:
                              type: string
                              enum:
