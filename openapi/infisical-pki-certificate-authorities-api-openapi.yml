                        friendlyName:
                          type: string
                        organization:
                          type: string
                        ou:
                          type: string
                        country:
                          type: string
                        province:
                          type: string
                        locality:
                          type: string
                        commonName:
                          type: string
                        dn:
                          type: string
                        serialNumber:
                          type: string
                          nullable: true
                        maxPathLength:
                          type: number
                          nullable: true
                        keyAlgorithm:
                          type: string
                        activeCaCertId:
                          type: string
                          format: uuid
                          nullable: true
                        crlDistributionPointUrls:
                          type: array
                          items:
                            type: string
                          nullable: true
                        disableManagedCrlDistributionPointUrl:
                          type: boolean
                          default: false
                        requireTemplateForIssuance:
                          type: boolean
                        notAfter:
                          type: string
                        notBefore:
                          type: string
                      required:
                      - id
