                    type: string
                  error:
                    type: string
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
      summary: Get agent vault session log settings
      x-summary-source: derived
    patch:
      operationId: updateAgentVaultSessionLogSettings
      tags:
      - Agent Vault Settings
      description: Updates the session log settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether session logs are on. Turning them off stops recording but keeps what's already recorded.
                appConnectionId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: The ID of the AWS connection Infisical uses to write to and read from the bucket.
                bucket:
                  type: string
                  maxLength: 63
                  pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                  description: 'The name of the S3 bucket. 3 to 63 characters: lowercase letters, numbers, dots and hyphens, starting and ending with a letter or number.'
                region:
                  type: string
                  enum:
                  - us-east-1
                  - us-east-2
                  - us-west-1
                  - us-west-2
                  - us-gov-east-1
                  - us-gov-west-1
                  - af-south-1
                  - ap-east-1
                  - ap-south-1
                  - ap-south-2
                  - ap-northeast-1
                  - ap-northeast-2
                  - ap-northeast-3
                  - ap-southeast-1
                  - ap-southeast-2
                  - ap-southeast-3
                  - ap-southeast-4
                  - ca-central-1
                  - eu-central-1
                  - eu-central-2
                  - eu-west-1
                  - eu-west-2
                  - eu-west-3
                  - eu-south-1
                  - eu-south-2
                  - eu-north-1
                  - me-south-1
                  - me-central-1
                  - sa-east-1
                  description: The AWS region of the bucket.
                keyPrefix:
                  type: string
                  maxLength: 512
                  pattern: ^[A-Za-z0-9!\-_.'()/]*$
                  description: 'The folder in the bucket to store session logs in, such as `logs/agent-vault`. Up to 512 characters: letters, numbers and `! - _ . '' ( ) /`, with no slash at the start or end, no empty folder name, and no folder named `.` or `..`.'
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether session logs are on. Turning them off stops recording but keeps what's already recorded.
                      appConnectionId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                        description: The ID of the AWS connection Infisical uses to write to and read from the bucket.
                      bucket:
                        type:
                        - string
                        - 'null'
                        description: 'The name of the S3 bucket. 3 to 63 characters: lowercase letters, numbers, dots and hyphens, starting and ending with a letter or number.'
                      region:
                        type:
                        - string
                        - 'null'
                        description: The AWS region of the bucket.
                      keyPrefix:
                        type:
                        - string
                        - 'null'
                        description: 'The folder in the bucket to store session logs in, such as `logs/agent-vault`. Up to 512 characters: letters, numbers and `! - _ . '' ( ) /`, with no slash at the start or end, no empty folder name, and no folder named `.` or `..`.'
                    required:
                    - enabled
                    - appConnectionId
                    - bucket
                    - region
                    - keyPrefix
                    additionalProperties: false
                required:
                - settings
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
