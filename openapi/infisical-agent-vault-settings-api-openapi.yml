openapi: 3.2.0
info:
  title: Infisical Agent Vault Settings API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Agent Vault Settings
paths:
  /api/v1/agent-vault/settings/session-logs:
    get:
      operationId: getAgentVaultSessionLogSettings
      tags:
      - Agent Vault Settings
      description: Gets the session log settings
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether session logs are on. Turning them off stops recording but keeps what's already recorded.
                      appConnectionId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                        description: The ID of the AWS connection Infisical uses to write to and read from the bucket.
                      bucket:
                        type:
                        - string
                        - 'null'
                        description: 'The name of the S3 bucket. 3 to 63 characters: lowercase letters, numbers, dots and hyphens, starting and ending with a letter or number.'
                      region:
                        type:
                        - string
                        - 'null'
                        description: The AWS region of the bucket.
                      keyPrefix:
                        type:
                        - string
                        - 'null'
                        description: 'The folder in the bucket to store session logs in, such as `logs/agent-vault`. Up to 512 characters: letters, numbers and `! - _ . '' ( ) /`, with no slash at the start or end, no empty folder name, and no folder named `.` or `..`.'
                    required:
                    - enabled
                    - appConnectionId
                    - bucket
                    - region
                    - keyPrefix
                    additionalProperties: false
                required:
                - settings
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 401
                  message:
