openapi: 3.2.0
info:
  title: Infisical Proxied Services API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Proxied Services
paths:
  /api/v1/proxied-services:
    post:
      tags:
      - Proxied Services
      description: Create a proxied service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  minLength: 1
                  description: The ID of the project to create the proxied service in.
                environment:
                  type: string
                  minLength: 1
                  description: The slug of the environment to create the proxied service in.
                secretPath:
                  type: string
                  default: /
                  description: The secret path (folder) to create the proxied service in.
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The name of the proxied service.
                hostPattern:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: One or more comma-separated host patterns the service applies to, e.g. 'api.stripe.com, *.stripe.com'. Each pattern is host[:port][/path]; a '*.' wildcard matches exactly one label.
                isEnabled:
                  type: boolean
                  description: Whether the proxied service is enabled. The agent proxy skips disabled services.
                credentials:
                  type: array
                  items:
                    type: object
                    properties:
                      secretKey:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: The key name of the referenced static secret. The secret must live in the same folder as the service. Provide exactly one of secretKey or dynamicSecretName.
                      dynamicSecretName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: The name of the referenced dynamic secret. The dynamic secret must live in the same folder as the service; the agent proxy mints a lease and injects a field from its output. Provide exactly one of secretKey or dynamicSecretName. Referenced by name (like secretKey), so a deleted-then-recreated dynamic secret with the same name re-links automatically.
                      dynamicSecretField:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: 'For a dynamic secret credential: which lease output field to inject (e.g. ''DB_PASSWORD'', ''TOKEN''). Must be a valid output field for the dynamic secret''s provider type.'
                      role:
                        type: string
                        enum:
                        - header-rewrite
                        - credential-substitution
                        description: 'How the credential is applied: ''header-rewrite'' sets an HTTP header on the outbound request; ''credential-substitution'' replaces a placeholder value in the request.'
                      headerName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: 'For header rewriting: the header to set, e.g. ''Authorization'' or ''x-api-key''.'
                      headerPrefix:
                        type: string
                        maxLength: 255
                        description: 'For header rewriting: an optional prefix joined to the secret value with a space, e.g. ''Bearer''.'
                      headerPurpose:
                        type: string
                        enum:
                        - username
                        - password
                        description: 'For HTTP basic auth: ''username'' or ''password''. The agent proxy combines the pair into a single ''Authorization: Basic'' header. Cannot be combined with headerName or headerPrefix.'
                      placeholderKey:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: 'For credential substitution: the environment variable name the agent receives.'
                      placeholderValue:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: 'For credential substitution: the placeholder value the agent proxy swaps for the real secret value on the wire.'
                      substitutionSurfaces:
                        type: array
                        items:
                          type: string
                          enum:
                          - header
                          - path
                          - query
                          - body
                        minItems: 1
                        description: 'For credential substitution: which request surfaces are scanned for the placeholder. Allowed values: ''header'', ''path'', ''query'', ''body''.'
                    required:
                    - role
                    additionalProperties: false
                  minItems: 1
                  description: The credentials the agent proxy applies to requests matching the host pattern.
              required:
              - projectId
              - environment
              - name
              - hostPattern
              - credentials
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: object
                    properties:
                      id:
