                              format: uuid
                            serviceId:
                              type: string
                              format: uuid
                            secretKey:
                              type:
                              - string
                              - 'null'
                            role:
                              type: string
                            headerName:
                              type:
                              - string
                              - 'null'
                            headerPrefix:
                              type:
                              - string
                              - 'null'
                            headerPurpose:
                              type:
                              - string
                              - 'null'
                            placeholderKey:
                              type:
                              - string
                              - 'null'
                            placeholderValue:
                              type:
                              - string
                              - 'null'
                            substitutionSurfaces:
                              type:
                              - array
                              - 'null'
                              items:
                                type: string
                            dynamicSecretName:
                              type:
                              - string
                              - 'null'
                            dynamicSecretField:
                              type:
                              - string
                              - 'null'
                          required:
                          - id
                          - serviceId
                          - role
                          additionalProperties: false
                    required:
                    - id
                    - name
                    - hostPattern
                    - folderId
                    - createdAt
                    - updatedAt
                    - credentials
                    additionalProperties: false
                required:
                - service
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
