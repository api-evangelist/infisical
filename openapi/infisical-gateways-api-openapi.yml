                              - 'null'
                            allowedNamespaces:
                              type: string
                            allowedNames:
                              type: string
                            allowedAudience:
                              type: string
                            verifyTlsCertificate:
                              type: boolean
                            caCertificate:
                              type: string
                            hasTokenReviewerJwt:
                              type: boolean
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                          required:
                          - id
                          - kubernetesHost
                          - tokenReviewMode
                          - gatewayId
                          - gatewayPoolId
                          - allowedNamespaces
                          - allowedNames
                          - allowedAudience
                          - verifyTlsCertificate
                          - caCertificate
                          - hasTokenReviewerJwt
                          - createdAt
                          - updatedAt
                          additionalProperties: false
                      required:
                      - method
                      - config
                      additionalProperties: false
                    - type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - token
                        config:
                          type: object
                          properties: {}
                          additionalProperties: false
                      required:
                      - method
                      - config
                      additionalProperties: false
                    - type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - identity
                        config:
                          type: object
                          properties:
                            identityId:
                              type: string
                            identityName:
                              type:
                              - string
                              - 'null'
                          required:
                          - identityId
                          - identityName
                          additionalProperties: false
                      required:
                      - method
                      - config
                      additionalProperties: false
                required:
                - id
                - name
                - createdAt
                - updatedAt
                - canRevoke
                - authMethod
                additionalProperties: false
        '400':
          description: Default Response
          content:
