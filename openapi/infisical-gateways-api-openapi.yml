                          - allowedAccountIds
                          - createdAt
                          - updatedAt
                          additionalProperties: false
                      required:
                      - method
                      - config
                      additionalProperties: false
                    - type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - gcp
                        config:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            type:
