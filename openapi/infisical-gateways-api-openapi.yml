                        method:
                          type: string
                          enum:
                          - aws
                        config:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            allowedPrincipalArns:
                              type: string
                            allowedAccountIds:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                          required:
                          - id
