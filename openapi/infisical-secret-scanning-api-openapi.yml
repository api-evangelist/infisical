openapi: 3.0.3
info:
  title: Infisical Admin Secret Scanning API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Secret Scanning
paths:
  /api/v2/secret-scanning/data-sources/options:
    get:
      operationId: listSecretScanningDataSourceOptions
      tags:
      - Secret Scanning
      description: List the available Secret Scanning Data Source Options.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataSourceOptions:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          name:
                            type: string
                            enum:
                            - GitHub
                          connection:
                            type: string
                            enum:
                            - github-radar
                          type:
                            type: string
                            enum:
                            - github
                        required:
                        - name
                        - connection
                        - type
                        additionalProperties: false
                        title: GitHub
                      - type: object
                        properties:
                          name:
                            type: string
                            enum:
                            - Bitbucket
                          connection:
                            type: string
                            enum:
                            - bitbucket
                          type:
                            type: string
                            enum:
                            - bitbucket
                        required:
                        - name
                        - connection
                        - type
                        additionalProperties: false
                        title: Bitbucket
                      - type: object
                        properties:
                          name:
                            type: string
                            enum:
                            - GitLab
                          connection:
                            type: string
                            enum:
                            - gitlab
                          type:
                            type: string
                            enum:
                            - gitlab
                        required:
                        - name
                        - connection
                        - type
                        additionalProperties: false
                        title: GitLab
                required:
                - dataSourceOptions
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 401
                  message:
