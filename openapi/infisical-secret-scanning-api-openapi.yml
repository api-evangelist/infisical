    patch:
      operationId: updateSecretScanningFindingsBatch
      tags:
      - Secret Scanning
      description: Update one or more Secret Scanning Findings in a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  findingId:
                    type: string
                    minLength: 1
                    description: The ID of the Secret Scanning Finding to update.
                  status:
                    type: string
                    enum:
                    - resolved
                    - unresolved
                    - false-positive
                    - ignore
                    description: The updated status of the specified Secret Scanning Finding.
                  remarks:
                    type: string
                    nullable: true
                    description: Remarks pertaining to the status of this finding.
                required:
                - findingId
                additionalProperties: false
              maxItems: 500
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
