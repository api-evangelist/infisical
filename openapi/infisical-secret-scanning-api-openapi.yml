  /api/v2/secret-scanning/data-sources:
    get:
      operationId: listSecretScanningDataSources
      tags:
      - Secret Scanning
      description: List all the Secret Scanning Data Sources for the specified project.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: query
        name: projectId
        required: true
        description: The ID of the project to list Scanning Data Sources from.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataSources:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          externalId:
                            type: string
                            nullable: true
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          encryptedCredentials:
                            nullable: true
                          isAutoScanEnabled:
                            type: boolean
                            default: true
                            nullable: true
                          projectId:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          isDisconnected:
                            type: boolean
                            default: false
                          type:
                            type: string
                            enum:
                            - github
                          connectionId:
                            type: string
                            format: uuid
                          connection:
                            type: object
                            properties:
                              app:
                                type: string
                                enum:
                                - github-radar
                              name:
                                type: string
                              id:
                                type: string
                                format: uuid
                            required:
                            - app
                            - name
                            - id
                            additionalProperties: false
                          config:
                            type: object
                            properties:
                              includeRepos:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                minItems: 1
                                maxItems: 100
                                default:
                                - '*'
                                description: The repositories to include when scanning. Defaults to all repositories (["*"]).
                            additionalProperties: false
                        required:
                        - id
                        - name
                        - projectId
                        - createdAt
                        - updatedAt
                        - type
                        - connectionId
                        - connection
                        - config
                        additionalProperties: false
                        title: GitHub
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          externalId:
                            type: string
                            nullable: true
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          encryptedCredentials:
                            nullable: true
                          isAutoScanEnabled:
                            type: boolean
                            default: true
                            nullable: true
                          projectId:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          isDisconnected:
                            type: boolean
                            default: false
                          type:
                            type: string
                            enum:
                            - bitbucket
                          connectionId:
                            type: string
                            format: uuid
                          connection:
                            type: object
                            properties:
                              app:
                                type: string
                                enum:
                                - bitbucket
                              name:
                                type: string
                              id:
                                type: string
                                format: uuid
                            required:
                            - app
                            - name
                            - id
                            additionalProperties: false
                          config:
                            type: object
                            properties:
                              workspaceSlug:
                                type: string
                                minLength: 1
                                maxLength: 128
                                description: The workspace to scan.
                              includeRepos:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                minItems: 1
                                maxItems: 100
                                default:
                                - '*'
                                description: The repositories to include when scanning. Defaults to all repositories (["*"]).
                            required:
                            - workspaceSlug
                            additionalProperties: false
                        required:
                        - id
                        - name
                        - projectId
                        - createdAt
                        - updatedAt
                        - type
                        - connectionId
                        - connection
                        - config
                        additionalProperties: false
                        title: Bitbucket
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          externalId:
                            type: string
                            nullable: true
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          encryptedCredentials:
                            nullable: true
                          isAutoScanEnabled:
                            type: boolean
                            default: true
                            nullable: true
                          projectId:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          isDisconnected:
                            type: boolean
                            default: false
                          type:
                            type: string
                            enum:
                            - gitlab
                          connectionId:
                            type: string
                            format: uuid
                          connection:
                            type: object
                            properties:
                              app:
                                type: string
                                enum:
                                - gitlab
                              name:
                                type: string
                              id:
                                type: string
                                format: uuid
                            required:
                            - app
                            - name
                            - id
                            additionalProperties: false
                          config:
                            anyOf:
                            - type: object
                              properties:
                                scope:
                                  type: string
                                  enum:
                                  - group
                                  description: The GitLab scope scanning should occur at (project or group level).
                                groupId:
                                  type: number
                                  description: The ID of the group to scan projects from.
                                groupName:
                                  type: string
                                  maxLength: 256
                                  description: The name of the group to scan projects from.
                                includeProjects:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                    maxLength: 256
                                  minItems: 1
                                  maxItems: 100
                                  default:
                                  - '*'
                                  description: The projects to include when scanning. Defaults to all projects (["*"]).
                              required:
                              - scope
                              - groupId
                              additionalProperties: false
                            - type: object
                              properties:
                                scope:
                                  type: string
                                  enum:
                                  - project
                                  description: The GitLab scope scanning should occur at (project or group level).
                                projectName:
                                  type: string
                                  maxLength: 256
                                  description: The name of the project to scan.
                                projectId:
                                  type: number
                                  description: The ID of the project to scan.
                              required:
                              - scope
                              - projectId
                              additionalProperties: false
                        required:
                        - id
                        - name
                        - projectId
                        - createdAt
                        - updatedAt
                        - type
                        - connectionId
                        - connection
                        - config
                        additionalProperties: false
                        title: GitLab
                required:
                - dataSources
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
