  /api/v1/auth/oidc-auth/identities/{identityId}:
    post:
      operationId: attachOidcAuth
      tags:
      - OIDC Auth
      description: Attach OIDC Auth configuration onto machine identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oidcDiscoveryUrl:
                  type: string
                  format: uri
                  minLength: 1
                  description: The URL used to retrieve the OpenID Connect configuration from the identity provider.
                caCert:
                  type: string
                  default: ''
                  description: The PEM-encoded CA cert for establishing secure communication with the Identity Provider endpoints.
                boundIssuer:
                  type: string
                  minLength: 1
                  description: The unique identifier of the identity provider issuing the JWT.
                boundAudiences:
                  type: string
                  default: ''
                  description: The list of intended recipients.
                boundClaims:
                  type: object
                  additionalProperties:
                    type: string
                  description: The attributes that should be present in the JWT for it to be valid.
                claimMetadataMapping:
                  type: object
                  additionalProperties:
                    type: string
                  description: The attributes that should be present in the permission metadata from the JWT.
                boundSubject:
                  type: string
                  default: ''
                  description: The expected principal that is the subject of the JWT.
                accessTokenTrustedIps:
                  type: array
                  items:
                    type: object
                    properties:
                      ipAddress:
                        type: string
                    required:
                    - ipAddress
                    additionalProperties: false
                  minItems: 1
                  default:
                  - ipAddress: 0.0.0.0/0
                  - ipAddress: ::/0
                  description: The IPs or CIDR ranges that access tokens can be used from.
                accessTokenTTL:
                  type: integer
                  minimum: 0
                  maximum: 315360000
                  default: 2592000
                  description: The lifetime for an access token in seconds.
                accessTokenMaxTTL:
                  type: integer
                  minimum: 0
                  maximum: 315360000
                  default: 2592000
                  description: The maximum lifetime for an access token in seconds.
                accessTokenNumUsesLimit:
                  type: integer
                  minimum: 0
                  default: 0
                  description: The maximum number of times that an access token can be used.
              required:
              - oidcDiscoveryUrl
              - boundIssuer
              - boundClaims
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to attach the configuration onto.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityOidcAuth:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      accessTokenTTL:
                        type: number
                        default: 7200
                      accessTokenMaxTTL:
                        type: number
                        default: 7200
                      accessTokenNumUsesLimit:
                        type: number
                        default: 0
                      accessTokenTrustedIps: {}
                      identityId:
                        type: string
                        format: uuid
                      oidcDiscoveryUrl:
                        type: string
                      boundIssuer:
                        type: string
                      boundAudiences:
                        type: string
                      boundClaims: {}
                      claimMetadataMapping:
                        nullable: true
                      boundSubject:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      caCert:
                        type: string
                    required:
                    - id
                    - identityId
                    - oidcDiscoveryUrl
                    - boundIssuer
                    - boundAudiences
                    - createdAt
                    - updatedAt
                    - caCert
                    additionalProperties: false
                required:
                - identityOidcAuth
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
