  /api/v1/cert-manager/installations/{installationId}:
    get:
      operationId: getPkiInstallation
      tags:
      - PKI Installations
      description: Get a PKI certificate installation by ID with linked certificates
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: installationId
        required: true
        description: The ID of the installation
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  locationType:
                    type: string
                  locationDetails: {}
                  locationFingerprint:
                    type: string
                  name:
                    type: string
                    nullable: true
                  type:
                    type: string
                    default: unknown
                  metadata:
                    nullable: true
                  lastSeenAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  discoveryName:
                    type: string
                    nullable: true
                  certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        certificateId:
                          type: string
                          format: uuid
                        firstSeenAt:
                          type: string
                          format: date-time
                        lastSeenAt:
                          type: string
                          format: date-time
                        commonName:
                          type: string
                          nullable: true
                        serialNumber:
                          type: string
                          nullable: true
                        notBefore:
                          type: string
                          format: date-time
                          nullable: true
                        notAfter:
                          type: string
                          format: date-time
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        friendlyName:
                          type: string
                          nullable: true
                        fingerprintSha256:
                          type: string
                          nullable: true
                        subjectOrganization:
                          type: string
                          nullable: true
                        subjectOrganizationalUnit:
                          type: string
                          nullable: true
                        subjectCountry:
                          type: string
                          nullable: true
                        subjectState:
                          type: string
                          nullable: true
                        subjectLocality:
                          type: string
                          nullable: true
                      required:
                      - certificateId
                      - firstSeenAt
                      - lastSeenAt
                      additionalProperties: false
                required:
                - id
                - locationType
                - locationFingerprint
                - lastSeenAt
                - createdAt
                - updatedAt
                additionalProperties: false
        '400':
          description: Default Response
          content:
