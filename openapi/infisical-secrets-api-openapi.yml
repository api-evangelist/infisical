  /api/v3/secrets/raw:
    get:
      tags:
      - Secrets
      description: List secrets
      parameters:
      - schema:
          type: string
        in: query
        name: metadataFilter
        required: false
        description: Unencrypted secret metadata key-value pairs used to filter secrets. Only metadata with unencrypted values is supported. When querying for multiple metadata pairs, the query is treated as an AND operation. Secret metadata format is key=value1,value=value2|key=value3,value=value4.
      - schema:
          type: string
        in: query
        name: workspaceId
        required: false
        description: The ID of the project to list secrets from.
      - schema:
          type: string
        in: query
        name: workspaceSlug
        required: false
        description: The slug of the project to list secrets from. This parameter is only applicable by machine identities.
      - schema:
          type: string
        in: query
        name: environment
        required: false
        description: The slug of the environment to list secrets from.
      - schema:
          type: string
          default: /
        in: query
        name: secretPath
        required: false
        description: The secret path to list secrets from.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
        in: query
        name: viewSecretValue
        required: false
        description: Whether or not to retrieve the secret value.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        in: query
        name: expandSecretReferences
        required: false
        description: Whether or not to expand secret references.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        in: query
        name: recursive
        required: false
        description: Whether or not to fetch all secrets from the specified base path, and all of its subdirectories. Note, the max depth is 20 deep.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        in: query
        name: include_imports
        required: false
        description: Weather to include imported secrets or not.
      - schema:
          type: string
        in: query
        name: tagSlugs
        required: false
        description: The comma separated tag slugs to filter secrets.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        _id:
                          type: string
                        workspace:
                          type: string
                        environment:
                          type: string
                        version:
                          type: number
                        type:
                          type: string
                        secretKey:
                          type: string
                        secretValue:
                          type: string
                        secretComment:
                          type: string
                        secretReminderNote:
                          type: string
                          nullable: true
                        secretReminderRepeatDays:
                          type: number
                          nullable: true
                        skipMultilineEncoding:
                          type: boolean
                          default: false
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        actor:
                          type: object
                          properties:
                            actorId:
                              type: string
                              nullable: true
                            actorType:
                              type: string
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            membershipId:
                              type: string
                              nullable: true
                            groupId:
                              type: string
                              nullable: true
                          additionalProperties: false
                          nullable: true
                        isRotatedSecret:
                          type: boolean
                        rotationId:
                          type: string
                          format: uuid
                          nullable: true
                        secretPath:
                          type: string
                        secretValueHidden:
                          type: boolean
                        secretMetadata:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                minLength: 1
                                maxLength: 255
                              value:
                                type: string
                                maxLength: 1020
                                default: ''
                              isEncrypted:
                                type: boolean
                                default: false
                            required:
                            - key
                            additionalProperties: false
                        tags:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              slug:
                                type: string
                              color:
                                type: string
                                nullable: true
                              name:
                                type: string
                            required:
                            - id
                            - slug
                            - name
                            additionalProperties: false
                      required:
                      - id
                      - _id
                      - workspace
                      - environment
                      - version
                      - type
                      - secretKey
                      - secretValue
                      - secretComment
                      - createdAt
                      - updatedAt
                      - secretValueHidden
                      additionalProperties: false
                  imports:
                    type: array
                    items:
                      type: object
                      properties:
                        secretPath:
                          type: string
                        environment:
                          type: string
                        folderId:
                          type: string
                        secrets:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              _id:
                                type: string
                              workspace:
                                type: string
                              environment:
                                type: string
                              version:
                                type: number
                              type:
                                type: string
                              secretKey:
                                type: string
                              secretValue:
                                type: string
                              secretComment:
                                type: string
                              secretReminderNote:
                                type: string
                                nullable: true
                              secretReminderRepeatDays:
                                type: number
                                nullable: true
                              skipMultilineEncoding:
                                type: boolean
                                default: false
                                nullable: true
                              actor:
                                type: object
                                properties:
                                  actorId:
                                    type: string
                                    nullable: true
                                  actorType:
                                    type: string
                                    nullable: true
                                  name:
                                    type: string
                                    nullable: true
                                  membershipId:
                                    type: string
                                    nullable: true
                                  groupId:
                                    type: string
                                    nullable: true
                                additionalProperties: false
                                nullable: true
                              isRotatedSecret:
                                type: boolean
                              rotationId:
                                type: string
                                format: uuid
                                nullable: true
                              secretValueHidden:
                                type: boolean
                              secretMetadata:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    key:
                                      type: string
                                      minLength: 1
                                      maxLength: 255
                                    value:
                                      type: string
                                      maxLength: 1020
                                      default: ''
                                    isEncrypted:
                                      type: boolean
                                      default: false
                                  required:
                                  - key
                                  additionalProperties: false
                            required:
                            - id
                            - _id
                            - workspace
                            - environment
                            - version
                            - type
                            - secretKey
                            - secretValue
                            - secretComment
                            - secretValueHidden
                            additionalProperties: false
                      required:
                      - secretPath
                      - environment
                      - secrets
                      additionalProperties: false
                required:
                - secrets
                additionalProperties: false
        '304':
          description: Default Response
          content:
            application/json:
              schema: {}
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
