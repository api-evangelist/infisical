  /api/v1/agent-vault/access-bundles/{accessBundleId}:
    get:
      operationId: getAgentVaultAccessBundle
      tags:
      - Agent Vault Access Bundles
      description: Get an Agent Vault access bundle with its services
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: accessBundleId
        required: true
        description: The ID of the access bundle.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessBundle:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The ID of the service.
                            accessBundleId:
                              type: string
                              format: uuid
                              description: The ID of the access bundle.
                            name:
                              type: string
                              description: The name of the service.
                            hostPattern:
                              type: string
                              description: A comma-separated set of hosts this service covers, each optionally with a port (defaults to `443`). A leading `*.` wildcard matches exactly one label. Paths are not supported.
                            allowedMethods:
                              type:
                              - array
                              - 'null'
                              items:
                                type: string
                                enum:
                                - GET
                                - HEAD
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                - OPTIONS
                              description: The HTTP methods this service allows. Null allows every method. Anything else is refused by the proxy with a 403.
                            allowedPathPrefixes:
                              type:
                              - array
                              - 'null'
                              items:
                                type: string
                              description: The path prefixes this service allows, matched on whole segments, so `/repos` covers `/repos/octo` but not `/repositories`. `null` allows every path. A path-restricted service also refuses any request whose path would have to be normalised to judge.
                            credential:
                              anyOf:
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - bearer
                                  headerName:
                                    type: string
                                    description: The header the credential is written to. Defaults to `Authorization`.
                                  headerPrefix:
                                    type: string
                                    description: Written before the credential value, separated by one space. Leave empty for a header that carries the value alone, such as DD-API-KEY. Can't contain `{{` or `}}`. On update a field left out keeps its stored value, so send an empty string to clear the prefix when changing the header.
                                required:
                                - type
                                - headerName
                                - headerPrefix
                                additionalProperties: false
                                title: Bearer
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - basic
                                required:
                                - type
                                additionalProperties: false
                                title: Basic Auth
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - passthrough
                                required:
                                - type
                                additionalProperties: false
                                title: Pass-through
                            customHeaders:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: The ID of the custom header. Send it to change that header in place. Omit it to match by name.
                                  name:
                                    type: string
                                    description: The name of the header, which must not be the credential's own header.
                                  prefix:
                                    type: string
                                    description: Written before the header value, separated by one space. Leave empty to send the value alone. Can't contain `{{` or `}}`.
                                required:
                                - id
                                - name
                                - prefix
                                additionalProperties: false
                              description: Additional headers the proxy attaches to every request to this service, on top of the credential. Send the full list. A header you leave out is deleted. Send a header's `id` to change it in place and keep its stored value. Without an `id`, a header is matched by name.
                            substitutions:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: The ID of the substitution. Send it to change that substitution in place. Omit it to match by placeholder.
                                  placeholder:
                                    type: string
                                    description: The fake value your agent already sends. The proxy replaces it with the real secret. Matched as a plain string, so a distinctive placeholder is worth choosing. Can't contain `{{` or `}}`.
                                  surfaces:
                                    type: array
                                    items:
                                      type: string
                                      enum:
                                      - path
                                      - query
                                      - header
                                      - body
                                    description: 'Where in the request to look for the placeholder: path, query, header or body.'
                                required:
                                - id
                                - placeholder
                                - surfaces
                                additionalProperties: false
                              description: Placeholders the proxy swaps for a real secret before forwarding. Send the full list. A substitution you leave out is deleted. Send a substitution's `id` to change it in place and keep its stored value. Without an `id`, it is matched by its placeholder.
                            variableReferences:
                              type: array
                              items:
                                anyOf:
                                - type: object
                                  properties:
                                    variableId:
                                      type: string
                                      format: uuid
                                      description: The ID of the variable.
                                    key:
                                      type: string
                                      description: The name services use to refer to the variable, as `{{KEY}}`. Starts with a letter and uses only upper case letters, numbers and underscores.
                                    field:
                                      type: string
                                      enum:
                                      - credential-value
                                      - credential-username
                                      description: 'Which value uses the variable: credential-value (a bearer token or a basic password), credential-username, custom-header or substitution.'
                                  required:
                                  - variableId
                                  - key
                                  - field
                                  additionalProperties: false
                                  title: Credential
                                - type: object
                                  properties:
                                    variableId:
                                      type: string
                                      format: uuid
                                      description: The ID of the variable.
                                    key:
                                      type: string
                                      description: The name services use to refer to the variable, as `{{KEY}}`. Starts with a letter and uses only upper case letters, numbers and underscores.
                                    field:
                                      type: string
                                      enum:
                                      - custom-header
                                      description: 'Which value uses the variable: credential-value (a bearer token or a basic password), credential-username, custom-header or substitution.'
                                    customHeaderId:
                                      type: string
                                      format: uuid
                                      description: The custom header whose value uses the variable.
                                  required:
                                  - variableId
                                  - key
                                  - field
                                  - customHeaderId
                                  additionalProperties: false
                                  title: Custom Header
                                - type: object
                                  properties:
                                    variableId:
                                      type: string
                                      format: uuid
                                      description: The ID of the variable.
                                    key:
                                      type: string
                                      description: The name services use to refer to the variable, as `{{KEY}}`. Starts with a letter and uses only upper case letters, numbers and underscores.
                                    field:
                                      type: string
                                      enum:
                                      - substitution
                                      description: 'Which value uses the variable: credential-value (a bearer token or a basic password), credential-username, custom-header or substitution.'
                                    substitutionId:
                                      type: string
                                      format: uuid
                                      description: The substitution whose value uses the variable.
                                  required:
                                  - variableId
                                  - key
                                  - field
                                  - substitutionId
                                  additionalProperties: false
                                  title: Substitution
                              description: The variables this service's credential, custom header values and substitution values use. Not returned to Agent Vault members, since only admins can see variables.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the service was added to the access bundle.
                            updatedAt:
                              type: string
                              format: date-time
                              description: When the service was last changed.
                          required:
                          - id
                          - accessBundleId
                          - name
                          - hostPattern
                          - allowedMethods
                          - allowedPathPrefixes
                          - credential
                          - customHeaders
                          - substitutions
                          - createdAt
                          - updatedAt
                          additionalProperties: false
                    required:
                    - id
                    - name
                    - createdAt
                    - updatedAt
                    - services
                    additionalProperties: false
                required:
                - accessBundle
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
