openapi: 3.2.0
info:
  title: Infisical Agent Vault Access Bundles API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Agent Vault Access Bundles
paths:
  /api/v1/agent-vault/access-bundles:
    get:
      operationId: listAgentVaultAccessBundles
      tags:
      - Agent Vault Access Bundles
      description: List the Agent Vault access bundles you can reach
      parameters:
      - schema:
          type: string
          enum:
          - name
          - serviceCount
          - createdAt
          default: createdAt
        in: query
        name: orderBy
        required: false
        description: 'What to sort access bundles by: name, serviceCount or createdAt.'
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        in: query
        name: orderDirection
        required: false
        description: 'Which way to sort: asc or desc.'
      - schema:
          type: string
          maxLength: 255
          pattern: ^[^\x00-\x1f\x7f]*$
        in: query
        name: search
        required: false
        description: Match access bundles by name or description.
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        in: query
        name: limit
        required: false
        description: The maximum number of access bundles to return.
      - schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        in: query
        name: offset
        required: false
        description: How many access bundles to skip.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessBundles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        serviceCount:
                          type: number
                          description: How many services the access bundle holds.
                        memberCount:
                          type: number
                          description: How many users, machine identities and groups can reach the access bundle.
                        hostPatterns:
                          type: array
                          items:
                            type: string
                          description: Every host pattern the access bundle's services cover.
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                      - serviceCount
                      - memberCount
                      - hostPatterns
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - accessBundles
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
