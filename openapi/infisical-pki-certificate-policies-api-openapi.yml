                              - data_encipherment
                              - key_agreement
                              - key_cert_sign
                              - crl_sign
                              - encipher_only
                              - decipher_only
                          required:
                            type: array
                            items:
                              type: string
                              enum:
                              - digital_signature
                              - key_encipherment
                              - non_repudiation
                              - data_encipherment
                              - key_agreement
                              - key_cert_sign
                              - crl_sign
                              - encipher_only
                              - decipher_only
                          denied:
