openapi: 3.2.0
info:
  title: Infisical PKI Certificate Policies API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: PKI Certificate Policies
paths:
  /api/v1/cert-manager/certificate-policies:
    post:
      operationId: createCertificatePolicy
      tags:
      - PKI Certificate Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 255
                subject:
                  type:
                  - array
                  - 'null'
                  items:
                    anyOf:
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - common_name
                          - organization
                          - country
                          - state
                          - locality
                          - organizational_unit
                        allowed:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                        required:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                        denied:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                      required:
                      - type
                      additionalProperties: false
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - domain_component
                        allowed:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                          maxItems: 25
                          description: 'Domain component sequences that are permitted. Each entry is one sequence, its components comma-joined most specific first: "corp,example,com" matches DC=corp,DC=example,DC=com. A request matches a sequence only when its components line up position by position, so the same labels in another order do not match.'
                        required:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                          maxItems: 25
                          description: 'Domain component sequences that are required. Each entry is one sequence, its components comma-joined most specific first: "corp,example,com" matches DC=corp,DC=example,DC=com. A request matches a sequence only when its components line up position by position, so the same labels in another order do not match.'
                        denied:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                          maxItems: 25
                          description: Domain component sequences that are rejected, each comma-joined most specific first. A sequence is rejected wherever it appears in the chain, so "example,com" rejects DC=example,DC=com and DC=host,DC=example,DC=com alike.
                      required:
                      - type
                      additionalProperties: false
                sans:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - dns_name
                        - ip_address
                        - email
                        - uri
                        - upn
                      allowed:
                        type: array
                        items:
                          type: string
                      required:
                        type: array
                        items:
                          type: string
                      denied:
                        type: array
                        items:
                          type: string
                    required:
                    - type
                    additionalProperties: false
                keyUsages:
                  type:
                  - object
                  - 'null'
                  properties:
                    allowed:
                      type: array
                      items:
                        type: string
                        enum:
                        - digital_signature
                        - key_encipherment
                        - non_repudiation
                        - data_encipherment
                        - key_agreement
                        - key_cert_sign
                        - crl_sign
                        - encipher_only
                        - decipher_only
                    required:
                      type: array
                      items:
                        type: string
                        enum:
                        - digital_signature
                        - key_encipherment
                        - non_repudiation
                        - data_encipherment
                        - key_agreement
                        - key_cert_sign
                        - crl_sign
                        - encipher_only
                        - decipher_only
                    denied:
                      type: array
                      items:
                        type: string
                        enum:
                        - digital_signature
                        - key_encipherment
                        - non_repudiation
                        - data_encipherment
                        - key_agreement
                        - key_cert_sign
                        - crl_sign
                        - encipher_only
                        - decipher_only
                  additionalProperties: false
                extendedKeyUsages:
                  type:
                  - object
                  - 'null'
                  properties:
                    allowed:
                      type: array
                      items:
                        type: string
                        enum:
                        - client_auth
                        - server_auth
                        - code_signing
                        - email_protection
                        - ocsp_signing
                        - smart_card_logon
                        - time_stamping
                        - any_purpose
                    required:
                      type: array
                      items:
                        type: string
                        enum:
                        - client_auth
                        - server_auth
                        - code_signing
                        - email_protection
                        - ocsp_signing
                        - smart_card_logon
                        - time_stamping
                        - any_purpose
                    denied:
                      type: array
                      items:
                        type: string
                        enum:
                        - client_auth
                        - server_auth
                        - code_signing
                        - email_protection
                        - ocsp_signing
                        - smart_card_logon
                        - time_stamping
                        - any_purpose
                  additionalProperties: false
                algorithms:
                  type:
                  - object
                  - 'null'
                  properties:
                    signature:
                      type: array
                      items:
                        type: string
                      minItems: 1
                    keyAlgorithm:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  additionalProperties: false
                validity:
                  type:
                  - object
                  - 'null'
                  properties:
                    max:
                      type: string
                  additionalProperties: false
                basicConstraints:
                  type:
                  - object
                  - 'null'
                  properties:
                    isCA:
                      type: string
                      enum:
                      - allowed
                      - required
                      - denied
                    maxPathLength:
                      type: integer
                      minimum: -1
                  additionalProperties: false
                customExtensions:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      oid:
                        type: string
                        maxLength: 64
                      label:
                        type: string
                        minLength: 1
                        maxLength: 64
                      critical:
                        type: string
                        enum:
                        - critical
                        - not_critical
                      allowed:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 4096
                        description: Value patterns this extension may take, with * as a wildcard. Use * on its own to accept any value. Omit to place no allow-list constraint on the value.
                      required:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 4096
                        description: Value patterns this extension must match, with * as a wildcard. Setting any required pattern also makes the extension mandatory on every request.
                      denied:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 4096
                        description: Value patterns this extension must not take, with * as a wildcard. A denied match is rejected even when an allowed pattern also matches.
                    required:
                    - oid
                    additionalProperties: false
                  description: Rules for custom X.509 extensions, one per OID. Omit the field to leave custom extensions unconstrained; send an empty array to forbid them entirely.
              required:
              - name
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificatePolicy:
                    type: object
                    properties:
                      id:
