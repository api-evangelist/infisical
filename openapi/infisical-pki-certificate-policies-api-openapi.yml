                        properties:
                          allowed:
                            type: array
                            items:
                              type: string
                              enum:
                              - client_auth
                              - server_auth
                              - code_signing
                              - email_protection
                              - ocsp_signing
                              - smart_card_logon
                              - time_stamping
                              - any_purpose
                          required:
                            type: array
                            items:
                              type: string
                              enum:
                              - client_auth
                              - server_auth
                              - code_signing
                              - email_protection
                              - ocsp_signing
                              - smart_card_logon
