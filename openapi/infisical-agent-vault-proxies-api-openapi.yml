    post:
      operationId: createAgentVaultProxy
      tags:
      - Agent Vault Proxies
      description: Register an Agent Vault proxy and issue its one-time enrollment token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The name of the proxy.
                trafficPolicy:
                  type: string
                  enum:
                  - any-host
                  - bundle-hosts
                  description: Which hosts an agent may reach through this proxy. `any-host` lets every request out; `bundle-hosts` allows only hosts an access bundle covers, plus anything in `allowedHosts`, and refuses the rest with a 403.
                  default: any-host
                allowedHosts:
                  type:
                  - string
                  - 'null'
                  maxLength: 1024
                  description: Hosts that stay reachable under the `bundle-hosts` traffic policy even though no access bundle covers them. Still intercepted, and given no credential.
                  default: null
                pollInterval:
                  type: integer
                  minimum: 10
                  maximum: 300
                  description: How often, in seconds, the proxy refreshes its sessions and settings. Between 10 and 300.
                  default: 60
              required:
              - name
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxy:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The ID of the proxy.
                      name:
                        type: string
                        description: The name of the proxy.
                      heartbeat:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: When the proxy last checked in, or `null` if it never has.
                      isHealthy:
                        type: boolean
                        description: Whether the proxy has checked in recently enough to be considered up.
                      rootCaFingerprint:
                        type:
                        - string
                        - 'null'
                        description: The SHA-256 fingerprint of the proxy's certificate authority. Pin this if you want to verify the proxy an agent connects to.
                      rootCaExpiresAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: When the proxy's certificate authority expires.
                      trafficPolicy:
                        type: string
                        enum:
                        - any-host
                        - bundle-hosts
                        description: Which hosts an agent may reach through this proxy. `any-host` lets every request out; `bundle-hosts` allows only hosts an access bundle covers, plus anything in `allowedHosts`, and refuses the rest with a 403.
                      allowedHosts:
                        type:
                        - string
                        - 'null'
                        description: Hosts that stay reachable under the `bundle-hosts` traffic policy even though no access bundle covers them. Still intercepted, and given no credential.
                      pollInterval:
                        type: number
                        description: How often, in seconds, the proxy refreshes its sessions and settings. Between 10 and 300.
                      createdAt:
                        type: string
                        format: date-time
                        description: When the proxy was registered.
                    required:
                    - id
                    - name
                    - heartbeat
                    - isHealthy
                    - rootCaFingerprint
                    - rootCaExpiresAt
                    - trafficPolicy
                    - allowedHosts
                    - pollInterval
                    - createdAt
                    additionalProperties: false
                    title: Admin view
                  token:
                    type: string
                    description: A one-time token the proxy enrolls with. Shown once, and valid for one hour.
                  expiresAt:
                    type: string
                    format: date-time
                required:
                - proxy
                - token
                - expiresAt
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
