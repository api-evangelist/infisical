  /api/v1/cert-manager/discovery-jobs:
    post:
      operationId: createPkiDiscovery
      tags:
      - PKI Discovery
      description: Create a new PKI discovery configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Name of the discovery configuration
                description:
                  type: string
                  maxLength: 500
                  description: Description of the discovery configuration
                discoveryType:
                  type: string
                  enum:
                  - network
                  default: network
                  description: Type of discovery scan
                targetConfig:
                  type: object
                  properties:
                    ipRanges:
                      type: array
                      items:
                        type: string
                        maxLength: 64
                    domains:
                      type: array
                      items:
                        type: string
                        maxLength: 253
                    ports:
                      type: string
                      default: 443, 8443, 636, 993, 995
                  additionalProperties: false
                  description: Target configuration for discovery scans
                isAutoScanEnabled:
                  type: boolean
                  default: false
                  description: Enable automatic scheduled scans
                scanIntervalDays:
                  type: number
                  minimum: 1
                  maximum: 365
                  description: Interval in days between automatic scans
                gatewayId:
                  type: string
                  format: uuid
                  description: Gateway ID for scanning private networks
                gatewayPoolId:
                  type: string
                  format: uuid
                  description: Gateway pool ID for scanning private networks
              required:
              - name
              - targetConfig
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  discoveryType:
                    type: string
                    default: network
                  targetConfig: {}
                  isAutoScanEnabled:
                    type: boolean
                    default: false
                  scanIntervalDays:
                    type: number
                    nullable: true
                  gatewayId:
                    type: string
                    format: uuid
                    nullable: true
                  isActive:
                    type: boolean
                    default: true
                  lastScanStatus:
                    type: string
                    nullable: true
                  lastScanJobId:
                    type: string
                    nullable: true
                  lastScanMessage:
                    type: string
                    nullable: true
                  lastScannedAt:
                    type: string
                    format: date-time
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  gatewayPoolId:
                    type: string
                    format: uuid
                    nullable: true
                required:
                - id
                - name
                - createdAt
                - updatedAt
                additionalProperties: false
        '400':
          description: Default Response
          content:
