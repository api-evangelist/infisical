                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        gatewayPoolId:
                          type: string
                          format: uuid
                          nullable: true
                        certificatesFound:
                          type: number
                        installationsFound:
                          type: number
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                      - certificatesFound
                      - installationsFound
                      additionalProperties: false
