    post:
      operationId: inviteProjectMembers
      tags:
      - Project Users
      description: Invite members to project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  default: []
                  description: A list of organization member emails to invite to the project.
                usernames:
                  type: array
                  items:
                    type: string
                  default: []
                  description: A list of usernames to invite to the project.
                roleSlugs:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: A list of role slugs to assign to the newly created project membership. If nothing is provided, it will default to the Member role.
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: projectId
        required: true
        description: The ID of the project to invite the member to.
      security:
      - bearerAuth: []
      responses:
        '200':
