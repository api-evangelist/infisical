                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          role:
                            type: string
                            description: 'The Agent Vault role: admin or member.'
                          addedAt:
                            type: string
                            format: date-time
                            description: When the member was added to Agent Vault.
                        required:
                        - type
                        - id
                        - role
                        - addedAt
                        additionalProperties: false
                        title: Machine identity
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - group
                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          role:
                            type: string
                            description: 'The Agent Vault role: admin or member.'
                          addedAt:
                            type: string
                            format: date-time
                            description: When the member was added to Agent Vault.
                        required:
                        - type
                        - id
                        - role
                        - addedAt
                        additionalProperties: false
                        title: Group
                  skipped:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - user
                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          identifier:
                            type: string
                            description: The ID or email address the request named, echoed back so a reply can be matched to it.
                        required:
