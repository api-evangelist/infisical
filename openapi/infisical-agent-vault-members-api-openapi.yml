openapi: 3.2.0
info:
  title: Infisical Agent Vault Members API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Agent Vault Members
paths:
  /api/v1/agent-vault/members:
    get:
      operationId: listAgentVaultMembers
      tags:
      - Agent Vault Members
      description: List the users, groups and machine identities that are members of Agent Vault
      parameters:
      - schema:
          type: string
          enum:
          - user
          - machineIdentity
          - group
        in: query
        name: actorType
        required: false
        description: List only users, only groups or only machine identities.
      - schema:
          type: string
          maxLength: 255
          pattern: ^[^\x00-\x1f\x7f]*$
        in: query
        name: search
        required: false
        description: Match members by name, username or email address.
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        in: query
        name: limit
        required: false
        description: The maximum number of members to return.
      - schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        in: query
        name: offset
        required: false
        description: How many members to skip.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - user
                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          username:
                            type: string
                            description: The username of the user.
                          email:
                            type:
                            - string
                            - 'null'
                            description: The email address of the user.
                          firstName:
                            type:
                            - string
                            - 'null'
                            description: The first name of the user.
                          lastName:
                            type:
                            - string
                            - 'null'
                            description: The last name of the user.
                          isOrgMembershipPending:
                            type: boolean
                            description: Whether the user still has an unaccepted invitation to the organization.
                          role:
                            type: string
                            description: 'The Agent Vault role: admin or member.'
                          isActive:
                            type: boolean
                            description: Whether the member can currently reach Agent Vault.
                          addedAt:
                            type: string
                            format: date-time
                            description: When the member was added to Agent Vault.
                        required:
                        - type
                        - id
                        - username
                        - email
                        - firstName
                        - lastName
                        - isOrgMembershipPending
                        - role
                        - isActive
                        - addedAt
                        additionalProperties: false
                        title: User
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - machineIdentity
                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          name:
                            type: string
                            description: The name of the machine identity.
                          isManagedByAgentVault:
                            type: boolean
                            description: Whether Agent Vault created the machine identity. One it owns is deleted rather than removed.
                          orgId:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: The ID of the organization the machine identity belongs to.
                          role:
                            type: string
                            description: 'The Agent Vault role: admin or member.'
                          isActive:
                            type: boolean
                            description: Whether the member can currently reach Agent Vault.
                          addedAt:
                            type: string
                            format: date-time
                            description: When the member was added to Agent Vault.
                        required:
                        - type
                        - id
                        - name
                        - isManagedByAgentVault
                        - orgId
                        - role
                        - isActive
                        - addedAt
                        additionalProperties: false
                        title: Machine identity
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - group
                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          name:
                            type: string
                            description: The name of the group.
                          role:
                            type: string
                            description: 'The Agent Vault role: admin or member.'
                          isActive:
                            type: boolean
                            description: Whether the member can currently reach Agent Vault.
                          addedAt:
                            type: string
                            format: date-time
                            description: When the member was added to Agent Vault.
                        required:
                        - type
                        - id
                        - name
                        - role
                        - isActive
                        - addedAt
                        additionalProperties: false
                        title: Group
                  totalCount:
                    type: number
                required:
                - members
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
