                            description: Whether this member is a user, a machine identity or a group.
                          id:
                            type: string
                            format: uuid
                            description: The ID of the user, machine identity or group.
                          identifier:
                            type: string
                            description: The ID or email address the request named, echoed back so a reply can be matched to it.
                        required:
                        - type
                        - id
                        - identifier
                        additionalProperties: false
                        title: Group
                    description: The requested members who already had access to Agent Vault and were left as they were.
