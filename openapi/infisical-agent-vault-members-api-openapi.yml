    post:
      operationId: addAgentVaultMembers
      tags:
      - Agent Vault Members
      description: Give users, groups and machine identities access to Agent Vault, by id or by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
                  description: The IDs of the users to act on.
                machineIdentityIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
                  description: The IDs of the machine identities to act on.
                groupIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
                  description: The IDs of the groups to act on.
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  default: []
                  description: The email addresses of the users to give access to. Each must already be in the organization.
                role:
                  type: string
                  enum:
                  - admin
                  - member
                  description: 'The Agent Vault role: admin or member.'
                  x-default: member
              required:
              - role
              additionalProperties: false
      responses:
