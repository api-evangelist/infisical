  /api/v2/organizations/{orgId}/identity-memberships:
    get:
      operationId: listOrgIdentityMemberships
      tags:
      - Organizations
      description: Return organization identity memberships
      parameters:
      - schema:
          type: number
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
        description: The offset to start from. If you enter 10, it will start from the 10th identity membership.
      - schema:
          type: number
          minimum: 1
          maximum: 20000
          default: 100
        in: query
        name: limit
        required: false
        description: The number of identity memberships to return.
      - schema:
          type: string
          enum:
          - name
          - role
          default: name
        in: query
        name: orderBy
        required: false
        description: The column to order identity memberships by.
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: orderDirection
        required: false
        description: The direction identity memberships will be sorted in.
      - schema:
          type: string
        in: query
        name: search
        required: false
        description: The text string that identity membership names will be filtered by.
      - schema:
          type: string
        in: path
        name: orgId
        required: true
        description: The ID of the organization to get identity memberships from.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityMemberships:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        role:
                          type: string
                        roleId:
                          type: string
                          format: uuid
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        identityId:
                          type: string
                          format: uuid
                        lastLoginAuthMethod:
                          type: string
                          nullable: true
                        lastLoginTime:
                          type: string
                          format: date-time
                          nullable: true
                        customRole:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            slug:
                              type: string
                            permissions: {}
                            description:
                              type: string
                              nullable: true
                          required:
                          - id
                          - name
                          - slug
                          additionalProperties: false
                        identity:
                          type: object
                          properties:
                            name:
                              type: string
                            id:
                              type: string
                              format: uuid
                            orgId:
