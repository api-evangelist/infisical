        name: organizationId
        required: true
        description: The ID of the organization to get memberships from.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        role:
                          type: string
                        status:
                          type: string
                          default: invited
                        inviteEmail:
                          type: string
                          nullable: true
                        userId:
                          type: string
                          format: uuid
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                        roleId:
                          type: string
                          format: uuid
                          nullable: true
                        projectFavorites:
                          type: array
                          items:
                            type: string
                          nullable: true
                        isActive:
                          type: boolean
                          default: true
                        lastInvitedAt:
                          type: string
                          format: date-time
                          nullable: true
                        lastLoginAuthMethod:
                          type: string
                          nullable: true
                        lastLoginTime:
                          type: string
                          format: date-time
                          nullable: true
                        user:
                          type: object
                          properties:
                            username:
                              type: string
                            email:
                              type: string
                              nullable: true
                            isEmailVerified:
                              type: boolean
                              default: false
                              nullable: true
                            firstName:
                              type: string
                              nullable: true
                            lastName:
                              type: string
                              nullable: true
                            authMethods:
                              type: array
                              items:
                                type: string
                              nullable: true
                            id:
                              type: string
                              format: uuid
                            publicKey:
                              type: string
                              nullable: true
                          required:
                          - username
                          - id
                          additionalProperties: false
                      required:
                      - id
                      - role
                      - orgId
                      - user
                      additionalProperties: false
                required:
                - users
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
