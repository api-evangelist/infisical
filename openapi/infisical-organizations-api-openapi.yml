                isActive:
                  type: boolean
                  description: The active status of the membership
                metadata:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        minLength: 1
                        description: The key for user metadata tag.
                      value:
                        type: string
                        minLength: 1
                        description: The value for user metadata tag.
                    required:
                    - key
                    - value
                    additionalProperties: false
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: organizationId
        required: true
        description: The ID of the organization to update the membership for.
      - schema:
          type: string
        in: path
        name: membershipId
        required: true
        description: The ID of the membership to update.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    type: object
