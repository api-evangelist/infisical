openapi: 3.0.3
info:
  title: Infisical Admin Project Templates API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Project Templates
paths:
  /api/v1/project-templates:
    get:
      tags:
      - Project Templates
      description: List project templates for the current organization.
      parameters:
      - schema:
          type: string
          enum:
          - secret-manager
          - cert-manager
          - kms
          - ssh
          - secret-scanning
          - pam
          - ai
        in: query
        name: type
        required: false
        description: The type of project template to list.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectTemplates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              slug:
                                type: string
                                minLength: 1
                                maxLength: 64
                              permissions:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    subject:
                                      anyOf:
                                      - type: string
                                        minLength: 1
                                      - type: array
                                        items:
                                          type: string
                                    action:
                                      anyOf:
                                      - type: string
                                        minLength: 1
                                      - type: array
                                        items:
                                          type: string
                                    conditions: {}
                                    inverted:
                                      type: boolean
                                  required:
                                  - action
                                  additionalProperties: false
                            required:
                            - name
                            - slug
                            - permissions
                            additionalProperties: false
                        environments:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              slug:
                                type: string
                                minLength: 1
                                maxLength: 64
                              position:
                                type: number
                                minimum: 1
                            required:
                            - name
                            - slug
                            - position
                            additionalProperties: false
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        type:
                          type: string
                          default: secret-manager
                        projectManagedIdentities:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              roles:
                                type: array
                                items:
                                  type: string
                            required:
                            - name
                            - roles
                            additionalProperties: false
                          nullable: true
                        users:
                          type: array
                          items:
                            type: object
                            properties:
                              username:
                                type: string
                                minLength: 1
                              roles:
                                type: array
                                items:
                                  type: string
                            required:
                            - username
                            - roles
                            additionalProperties: false
                          nullable: true
                        groups:
                          type: array
                          items:
                            type: object
                            properties:
                              groupSlug:
                                type: string
                              roles:
                                type: array
                                items:
                                  type: string
                            required:
                            - groupSlug
                            - roles
                            additionalProperties: false
                          nullable: true
                        identities:
                          type: array
                          items:
                            type: object
                            properties:
                              identityId:
                                type: string
                                format: uuid
                              identityName:
                                type: string
                              roles:
                                type: array
                                items:
                                  type: string
                            required:
                            - identityId
                            - identityName
                            - roles
                            additionalProperties: false
                          nullable: true
                      required:
                      - id
                      - name
                      - roles
                      - environments
                      - orgId
                      - createdAt
                      - updatedAt
                      - projectManagedIdentities
                      - users
                      - groups
                      - identities
                      additionalProperties: false
                required:
                - projectTemplates
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
