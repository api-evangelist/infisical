                          type: string
                          minLength: 1
                        secretAccessKey:
                          type: string
                          minLength: 1
                      required:
                      - accessKeyId
                      - secretAccessKey
                      additionalProperties: false
                      description: The credentials used to connect with AWS.
                  required:
                  - method
                  - credentials
                  additionalProperties: false
              - type: object
                properties:
