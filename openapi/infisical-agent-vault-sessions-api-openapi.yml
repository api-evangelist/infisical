    post:
      operationId: createAgentVaultSession
      tags:
      - Agent Vault Sessions
      description: Create an Agent Vault session with an access bundle you can reach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessBundles:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  minItems: 1
                  maxItems: 1
                  description: The access bundle this session carries, by name. A list that accepts exactly one name.
                ttl:
                  type: string
                  default: 7d
                  description: 'How long the session lasts: a duration such as 30m, 8h or 7d (at least 1m), or never. Defaults to 7d.'
              required:
              - accessBundles
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The ID of the session.
                      token:
                        type: string
                        description: The session token. Returned once, at mint, and never again.
                      expiresAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: When the session expires, or null when it never does.
                      createdAt:
                        type: string
                        format: date-time
                      accessBundles:
                        type: array
