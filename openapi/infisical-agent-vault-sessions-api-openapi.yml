openapi: 3.2.0
info:
  title: Infisical Agent Vault Sessions API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Agent Vault Sessions
paths:
  /api/v1/agent-vault/sessions:
    get:
      operationId: listAgentVaultSessions
      tags:
      - Agent Vault Sessions
      description: List Agent Vault sessions
      parameters:
      - schema:
          type: string
          enum:
          - mine
          - all
          default: mine
        in: query
        name: scope
        required: false
        description: 'Whose sessions to list: your own (mine) or everyone''s (all, administrators only).'
      - schema:
          allOf:
          - anyOf:
            - not: {}
            - type: string
              maxLength: 64
          - anyOf:
            - not: {}
            - type: array
              items:
                type: string
                enum:
                - active
                - revoked
                - expired
        in: query
        name: status
        required: false
        description: 'Filter by session status: `active`, `revoked` or `expired`. Separate several with commas to match any of them.'
      - schema:
          type: string
          maxLength: 255
          pattern: ^[^\x00-\x1f\x7f]*$
        in: query
        name: search
        required: false
        description: Match sessions by actor name, actor email or access bundle name.
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        in: query
        name: limit
        required: false
        description: The maximum number of sessions to return.
      - schema:
          type: integer
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
        description: How many sessions to skip.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The ID of the session.
                        actor:
                          anyOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - user
                                description: Whether the session belongs to a user or a machine identity.
                              id:
                                type:
                                - string
                                - 'null'
                                format: uuid
                                description: The ID of the user or machine identity the session belongs to, or null if it was deleted.
                              username:
                                type: string
                                description: The username of the user. Once the user is deleted, the email recorded when the session was created.
                              email:
                                type:
                                - string
                                - 'null'
                                description: The email address of the user. Once the user is deleted, the email recorded when the session was created.
                              firstName:
                                type:
                                - string
                                - 'null'
                                description: The first name of the user. Once the user is deleted, the full name recorded when the session was created.
                              lastName:
                                type:
                                - string
                                - 'null'
                                description: The last name of the user, or null once the user is deleted.
                            required:
                            - type
                            - id
                            - username
                            - email
                            - firstName
                            - lastName
                            additionalProperties: false
                            title: User
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - machineIdentity
                                description: Whether the session belongs to a user or a machine identity.
                              id:
                                type:
                                - string
                                - 'null'
                                format: uuid
                                description: The ID of the user or machine identity the session belongs to, or null if it was deleted.
                              name:
                                type: string
                                description: The name of the machine identity. Once the machine identity is deleted, the name recorded when the session was created.
                            required:
                            - type
                            - id
                            - name
                            additionalProperties: false
                            title: Machine identity
                        status:
                          type: string
                          enum:
                          - active
                          - revoked
                          - expired
                        expiresAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the session expires, or null when it never does.
                        revokedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        accessBundles:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type:
                                - string
                                - 'null'
                                format: uuid
                              name:
                                type: string
                              position:
                                type: number
                            required:
                            - id
                            - name
                            - position
                            additionalProperties: false
                      required:
                      - id
                      - actor
                      - status
                      - expiresAt
                      - revokedAt
                      - createdAt
                      - accessBundles
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - sessions
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
          content:
