openapi: 3.0.3
info:
  title: Infisical Admin PKI Certificate Profiles API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: PKI Certificate Profiles
paths:
  /api/v1/cert-manager/certificate-profiles:
    post:
      operationId: createCertificateProfile
      tags:
      - PKI Certificate Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caId:
                  type: string
                  format: uuid
                certificatePolicyId:
                  type: string
                  format: uuid
                slug:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[a-z0-9-]+$
                description:
                  type: string
                  maxLength: 1000
                issuerType:
                  type: string
                  enum:
                  - ca
                  - self-signed
                  default: ca
                externalConfigs:
                  anyOf:
                  - type: object
                    properties:
                      template:
                        type: string
                        minLength: 1
                        description: Certificate template name for Azure AD CS
                    required:
                    - template
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  - type: object
                    properties: {}
                    additionalProperties: false
                  nullable: true
                defaults:
                  type: object
                  properties:
                    ttlDays:
                      type: integer
                      exclusiveMinimum: true
                      minimum: 0
                    commonName:
                      type: string
                    keyAlgorithm:
                      type: string
                      enum:
                      - RSA_2048
                      - RSA_3072
                      - RSA_4096
                      - EC_prime256v1
                      - EC_secp384r1
                      - EC_secp521r1
                      - ML-DSA-44
                      - ML-DSA-65
                      - ML-DSA-87
                      - SLH-DSA-SHA2-128f
                      - SLH-DSA-SHA2-128s
                      - SLH-DSA-SHA2-192f
                      - SLH-DSA-SHA2-192s
                      - SLH-DSA-SHA2-256f
                      - SLH-DSA-SHA2-256s
                      - SLH-DSA-SHAKE-128f
                      - SLH-DSA-SHAKE-128s
                      - SLH-DSA-SHAKE-192f
                      - SLH-DSA-SHAKE-192s
                      - SLH-DSA-SHAKE-256f
                      - SLH-DSA-SHAKE-256s
                    signatureAlgorithm:
                      type: string
                      enum:
                      - RSA-SHA256
                      - RSA-SHA384
                      - RSA-SHA512
                      - ECDSA-SHA256
                      - ECDSA-SHA384
                      - ECDSA-SHA512
                      - ML-DSA-44
                      - ML-DSA-65
                      - ML-DSA-87
                      - SLH-DSA-SHA2-128f
                      - SLH-DSA-SHA2-128s
                      - SLH-DSA-SHA2-192f
                      - SLH-DSA-SHA2-192s
                      - SLH-DSA-SHA2-256f
                      - SLH-DSA-SHA2-256s
                      - SLH-DSA-SHAKE-128f
                      - SLH-DSA-SHAKE-128s
                      - SLH-DSA-SHAKE-192f
                      - SLH-DSA-SHAKE-192s
                      - SLH-DSA-SHAKE-256f
                      - SLH-DSA-SHAKE-256s
                    keyUsages:
                      type: array
                      items:
                        type: string
                        enum:
                        - digital_signature
                        - key_encipherment
                        - non_repudiation
                        - data_encipherment
                        - key_agreement
                        - key_cert_sign
                        - crl_sign
                        - encipher_only
                        - decipher_only
                    extendedKeyUsages:
                      type: array
                      items:
                        type: string
                        enum:
                        - client_auth
                        - server_auth
                        - code_signing
                        - email_protection
                        - ocsp_signing
                        - time_stamping
                    basicConstraints:
                      type: object
                      properties:
                        isCA:
                          type: boolean
                        pathLength:
                          type: integer
                          minimum: 0
                      required:
                      - isCA
                      additionalProperties: false
                    organization:
                      type: string
                    organizationalUnit:
                      type: string
                    country:
                      type: string
                    state:
                      type: string
                    locality:
                      type: string
                  additionalProperties: false
                  nullable: true
              required:
              - certificatePolicyId
              - slug
              additionalProperties: false
