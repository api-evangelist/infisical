                            - SLH-DSA-SHAKE-256f
                            - SLH-DSA-SHAKE-256s
                          keyUsages:
                            type: array
                            items:
                              type: string
                              enum:
                              - digital_signature
                              - key_encipherment
                              - non_repudiation
                              - data_encipherment
                              - key_agreement
                              - key_cert_sign
                              - crl_sign
                              - encipher_only
                              - decipher_only
                          extendedKeyUsages:
                            type: array
