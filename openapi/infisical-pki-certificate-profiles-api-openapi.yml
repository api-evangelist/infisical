                              type: string
                              enum:
                              - client_auth
                              - server_auth
                              - code_signing
                              - email_protection
                              - ocsp_signing
                              - time_stamping
                          basicConstraints:
                            type: object
                            properties:
                              isCA:
                                type: boolean
                              pathLength:
                                type: number
                            required:
                            - isCA
                            additionalProperties: false
                          organization:
                            type: string
                          organizationalUnit:
                            type: string
                          country:
                            type: string
                          state:
                            type: string
                          locality:
                            type: string
                        additionalProperties: false
                        nullable: true
                      scepConfigId:
                        type: string
                        format: uuid
                        nullable: true
                    required:
                    - id
                    - certificatePolicyId
                    - slug
                    - enrollmentType
                    - createdAt
                    - updatedAt
                    additionalProperties: false
