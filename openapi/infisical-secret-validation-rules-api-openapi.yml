                environment:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The slug of the environment to scope this rule to. Omit to enforce the rule in every environment of the project.
                secretPath:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: The secret path to scope this rule to. Supports glob patterns such as `/apps/**`.
                isActive:
                  type: boolean
                  default: true
                  description: Whether the rule is enforced. An inactive rule is kept but ignored.
                keyConstraints:
