                      description: The maximum number of characters the secret value may contain.
                    regexPattern:
                      type: string
                      minLength: 1
                      maxLength: 4096
                      description: A regular expression the secret value must match.
                    requiredPrefix:
                      type: string
                      minLength: 1
                      maxLength: 1024
