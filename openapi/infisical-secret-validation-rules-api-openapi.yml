openapi: 3.2.0
info:
  title: Infisical Secret Validation Rules API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Secret Validation Rules
paths:
  /api/v1/secret-validation-rules:
    get:
      operationId: listSecretValidationRules
      tags:
      - Secret Validation Rules
      description: List every Secret Validation Rule in the specified project, of any type.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 36
        in: query
        name: projectId
        required: true
        description: The ID of the project to list Secret Validation Rules from.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretValidationRules:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          description:
                            type:
                            - string
                            - 'null'
                          projectId:
                            type: string
                          secretPath:
                            type: string
                          isActive:
                            type: boolean
                            default: true
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          environment:
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              slug:
                                type: string
                            required:
                            - id
                            - name
                            - slug
                            additionalProperties: false
                          type:
                            type: string
                            enum:
                            - static-secrets
                          keyConstraints:
                            type: object
                            properties:
                              minLength:
                                type: integer
                                minimum: 1
                                maximum: 65536
                                description: The minimum number of characters the secret key must contain.
                              maxLength:
                                type: integer
                                minimum: 1
                                maximum: 65536
                                description: The maximum number of characters the secret key may contain.
                              regexPattern:
                                type: string
                                minLength: 1
                                maxLength: 4096
                                description: A regular expression the secret key must match.
                              requiredPrefix:
                                type: string
                                minLength: 1
                                maxLength: 1024
                                description: A string the secret key must start with.
                              requiredSuffix:
                                type: string
                                minLength: 1
                                maxLength: 1024
                                description: A string the secret key must end with.
                            additionalProperties: false
                            description: Constraints enforced on the secret key when a secret is created or renamed. Omit to leave keys unconstrained.
                          valueConstraints:
