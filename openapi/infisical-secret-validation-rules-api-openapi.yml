                                type: integer
                                minimum: 1
                                maximum: 2048
                                description: The maximum number of characters the generated password may contain.
                              regexPattern:
                                type: string
                                minLength: 1
                                maxLength: 4096
                                description: A regular expression the generated password must match.
                              requiredPrefix:
                                type: string
                                minLength: 1
                                maxLength: 1024
                                description: A string the generated password must start with.
                              requiredSuffix:
                                type: string
