                                description: A string the secret value must start with.
                              requiredSuffix:
                                type: string
                                minLength: 1
                                maxLength: 1024
                                description: A string the secret value must end with.
                              uniqueAcrossLastVersions:
                                type: integer
                                minimum: 1
                                maximum: 25
                                description: How many of the secret's own previous versions the new value must differ from. Between 1 and 25. Omit to accept a value the secret has held before.
