  /api/v1/kms/keys/bulk-import:
    post:
      operationId: bulkImportKmsKeys
      tags:
      - KMS Keys
      description: Bulk import KMS keys with provided key material into a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  format: uuid
                keys:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 32
                      keyUsage:
                        type: string
                        enum:
                        - encrypt-decrypt
                        - sign-verify
                      encryptionAlgorithm:
                        type: string
                        enum:
                        - aes-256-gcm
                        - aes-128-gcm
                        - RSA_4096
                        - ECC_NIST_P256
                        - ECC_NIST_P384
                        - ECC_NIST_P521
                        - ML_DSA_44
                        - ML_DSA_65
                        - ML_DSA_87
                      keyMaterial:
                        type: string
                        minLength: 1
                    required:
                    - name
                    - keyUsage
                    - encryptionAlgorithm
                    - keyMaterial
                    additionalProperties: false
                  minItems: 1
                  maxItems: 100
              required:
