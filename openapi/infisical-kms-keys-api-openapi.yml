openapi: 3.0.3
info:
  title: Infisical Admin KMS Keys API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: KMS Keys
paths:
  /api/v1/kms/keys:
    post:
      operationId: createKmsKey
      tags:
      - KMS Keys
      description: Create KMS key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: The ID of the project to create the key in.
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: The name of the key to be created. Must be slug-friendly.
                description:
                  type: string
                  maxLength: 500
                  description: An optional description of the key.
                keyUsage:
                  type: string
                  enum:
                  - encrypt-decrypt
                  - sign-verify
                  default: encrypt-decrypt
                  description: The type of key to be created, either encrypt-decrypt or sign-verify, based on your intended use for the key.
                encryptionAlgorithm:
                  type: string
                  enum:
                  - aes-256-gcm
                  - aes-128-gcm
                  - RSA_4096
                  - ECC_NIST_P256
                  - ECC_NIST_P384
                  - ECC_NIST_P521
                  - ML_DSA_44
                  - ML_DSA_65
                  - ML_DSA_87
                  default: aes-256-gcm
                  description: The algorithm to use when performing cryptographic operations with the key.
              required:
              - projectId
              - name
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      description:
                        type: string
                        nullable: true
                      isDisabled:
                        type: boolean
                        default: false
                        nullable: true
                      orgId:
                        type: string
                        format: uuid
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      projectId:
                        type: string
                        nullable: true
                      keyUsage:
                        type: string
                        default: encrypt-decrypt
                      kmipMetadata:
                        nullable: true
                      version:
                        type: number
                        default: 1
                      encryptionAlgorithm:
                        type: string
                    required:
                    - id
                    - orgId
                    - name
                    - createdAt
                    - updatedAt
                    - encryptionAlgorithm
                    additionalProperties: false
                required:
                - key
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
