      - schema:
          type: string
        in: path
        name: projectId
        required: true
        description: The ID of the project to update the identity membership for.
      - schema:
          type: string
        in: path
        name: identityId
        required: true
        description: The ID of the machine identity to update the membership for.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: object
