                        isTemporary:
                          type: boolean
                          enum:
                          - false
                          default: false
                          description: Whether the assigned role is temporary. If isTemporary is set true, must provide temporaryMode, temporaryRange and temporaryAccessStartTime.
                      required:
                      - role
                      additionalProperties: false
                    - type: object
                      properties:
                        role:
                          type: string
                          description: The role slug to assign to the newly created identity project membership.
                        isTemporary:
                          type: boolean
                          enum:
                          - true
                          description: Whether the assigned role is temporary. If isTemporary is set true, must provide temporaryMode, temporaryRange and temporaryAccessStartTime.
                        temporaryMode:
                          type: string
                          enum:
                          - relative
                          description: Type of temporary expiry.
                        temporaryRange:
                          type: string
                          description: Expiry time for temporary access. In relative mode it could be 1s, 2m ,3h, etc.
                        temporaryAccessStartTime:
                          type: string
                          format: date-time
                          description: Time to which the temporary access starts.
                      required:
                      - role
                      - isTemporary
                      - temporaryMode
                      - temporaryRange
                      - temporaryAccessStartTime
                      additionalProperties: false
                  minItems: 1
                  description: A list of role slugs to assign to the identity project membership.
              required:
              - roles
              additionalProperties: false
