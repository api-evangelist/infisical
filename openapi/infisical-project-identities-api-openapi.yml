      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  default: no-access
                roles:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        role:
                          type: string
                          description: The role slug to assign to the newly created identity project membership.
                        isTemporary:
                          type: boolean
                          enum:
                          - false
                          default: false
                          description: The role slug to assign to the newly created identity project membership.
                      required:
                      - role
                      additionalProperties: false
                    - type: object
                      properties:
                        role:
                          type: string
                          description: The role slug to assign to the newly created identity project membership.
                        isTemporary:
                          type: boolean
                          enum:
                          - true
                          description: The role slug to assign to the newly created identity project membership.
                        temporaryMode:
                          type: string
                          enum:
                          - relative
                          description: The role slug to assign to the newly created identity project membership.
                        temporaryRange:
                          type: string
                          description: The role slug to assign to the newly created identity project membership.
                        temporaryAccessStartTime:
                          type: string
                          format: date-time
                          description: The role slug to assign to the newly created identity project membership.
                      required:
                      - role
                      - isTemporary
                      - temporaryMode
                      - temporaryRange
                      - temporaryAccessStartTime
                      additionalProperties: false
                  description: A list of role slugs to assign to the newly created identity project membership.
              additionalProperties: false
      parameters:
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      - schema:
          type: string
        in: path
        name: identityId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityMembership:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      projectId:
                        type: string
                      identityId:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                    - id
                    - projectId
                    - identityId
                    - createdAt
                    - updatedAt
                    additionalProperties: false
                required:
                - identityMembership
                additionalProperties: false
        '400':
