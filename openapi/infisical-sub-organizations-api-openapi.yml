              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Optional. The display name of the sub-organization. When only the name is provided (no slug), both name and slug are updated.
                slug:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Optional. The slug of the sub-organization. Can be updated independently when both name and slug are provided.
              additionalProperties: false
