    get:
      operationId: listSubOrganizations
      tags:
      - Sub Organizations
      description: List of sub organizations
      parameters:
      - schema:
          type: number
          minimum: 1
          maximum: 1000
          default: 25
        in: query
        name: limit
        required: false
        description: The number of sub organizations to return.
      - schema:
          type: number
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
        description: The offset to start from. If you enter 10, it will start from the 10th sub organization.
      - schema:
          type: string
        in: query
        name: search
        required: false
        description: Optional. Filter sub organizations by name (case-insensitive substring match).
      - schema:
          type: string
          enum:
          - name
          default: name
        in: query
        name: orderBy
        required: false
        description: The field to order sub organizations by. Currently only 'name' is supported.
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: orderDirection
        required: false
        description: The direction to order sub organizations. Either 'asc' or 'desc'.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: isAccessible
        required: false
        description: Filter to only return sub organizations that the actor has access to.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        slug:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        parentOrgId:
                          type: string
                          format: uuid
                          nullable: true
                      required:
                      - id
                      - name
                      - slug
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - organizations
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
