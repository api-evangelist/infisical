      - schema:
          type: string
        in: query
        name: projectId
        required: true
        description: Project ID
      - schema:
          type: string
        in: path
        name: caId
        required: true
        description: Azure AD CS CA ID
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Template identifier
                        name:
                          type: string
                          description: Template display name
                        description:
                          type: string
                          description: Template description
                      required:
                      - id
                      - name
                      additionalProperties: false
                required:
                - templates
                additionalProperties: false
        '400':
          description: Default Response
