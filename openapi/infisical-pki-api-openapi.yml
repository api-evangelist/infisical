  /api/v1/pki/syncs/aws-elastic-load-balancer/load-balancers:
    get:
      description: List AWS Elastic Load Balancers available for the specified connection and region.
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: connectionId
        required: true
      - schema:
          type: string
          enum:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - us-gov-east-1
          - us-gov-west-1
          - af-south-1
          - ap-east-1
          - ap-south-1
          - ap-south-2
          - ap-northeast-1
          - ap-northeast-2
          - ap-northeast-3
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-4
          - ca-central-1
          - eu-central-1
          - eu-central-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-south-1
          - eu-south-2
          - eu-north-1
          - me-south-1
          - me-central-1
          - sa-east-1
        in: query
        name: region
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  loadBalancers:
                    type: array
                    items:
                      type: object
                      properties:
                        loadBalancerArn:
                          type: string
                        loadBalancerName:
                          type: string
                        type:
                          type: string
                          enum:
                          - application
                          - network
                          - gateway
                        scheme:
                          type: string
                        state:
                          type: string
                        vpcId:
                          type: string
                        dnsName:
                          type: string
                      required:
                      - loadBalancerArn
                      - loadBalancerName
                      - type
                      - scheme
                      - state
                      additionalProperties: false
                required:
