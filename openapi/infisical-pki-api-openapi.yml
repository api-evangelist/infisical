  /api/v1/pki/syncs/aws-elastic-load-balancer/listeners:
    get:
      description: List HTTPS/TLS listeners for the specified AWS Elastic Load Balancer.
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: connectionId
        required: true
      - schema:
          type: string
          enum:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - us-gov-east-1
          - us-gov-west-1
          - af-south-1
          - ap-east-1
          - ap-south-1
          - ap-south-2
          - ap-northeast-1
          - ap-northeast-2
          - ap-northeast-3
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-4
          - ca-central-1
          - eu-central-1
          - eu-central-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-south-1
          - eu-south-2
          - eu-north-1
          - me-south-1
          - me-central-1
          - sa-east-1
        in: query
        name: region
        required: true
      - schema:
          type: string
          minLength: 1
        in: query
        name: loadBalancerArn
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  listeners:
                    type: array
                    items:
                      type: object
                      properties:
                        listenerArn:
                          type: string
                        port:
                          type: number
                        protocol:
                          type: string
                        loadBalancerArn:
                          type: string
                        sslPolicy:
                          type: string
                        certificates:
                          type: array
                          items:
                            type: object
                            properties:
                              certificateArn:
                                type: string
                              isDefault:
                                type: boolean
                            required:
                            - certificateArn
                            - isDefault
                            additionalProperties: false
                      required:
                      - listenerArn
                      - port
                      - protocol
                      - loadBalancerArn
                      additionalProperties: false
                required:
                - listeners
                additionalProperties: false
        '400':
