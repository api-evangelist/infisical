  /api/v1/pki/certificates/issue-certificate:
    post:
      tags:
      - PKI Certificates
      description: Issue certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caId:
                  type: string
                  description: The ID of the CA to issue the certificate from.
                certificateTemplateId:
                  type: string
                  description: The ID of the certificate template to issue the certificate from.
                pkiCollectionId:
                  type: string
                  description: The ID of the PKI collection to add the certificate to.
                friendlyName:
                  type: string
                  description: A friendly name for the certificate.
                commonName:
                  type: string
                  minLength: 1
                  description: The common name (CN) for the certificate.
                altNames:
                  type: string
                  default: ''
                  description: A comma-delimited list of Subject Alternative Names (SANs) for the certificate; these can be host names or email addresses.
                ttl:
                  type: string
                  description: The time to live for the certificate such as 1m, 1h, 1d, 1y, ...
                notBefore:
                  type: string
                  description: The date and time when the certificate becomes valid in YYYY-MM-DDTHH:mm:ss.sssZ format.
                notAfter:
                  type: string
                  description: The date and time when the certificate expires in YYYY-MM-DDTHH:mm:ss.sssZ format.
                keyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - digitalSignature
                    - keyEncipherment
                    - nonRepudiation
                    - dataEncipherment
                    - keyAgreement
                    - keyCertSign
                    - cRLSign
                    - encipherOnly
                    - decipherOnly
                  description: The key usage extension of the certificate.
                extendedKeyUsages:
                  type: array
                  items:
                    type: string
                    enum:
                    - clientAuth
                    - serverAuth
                    - codeSigning
                    - emailProtection
                    - timeStamping
                    - ocspSigning
                  description: The extended key usage extension of the certificate.
              required:
              - commonName
              - ttl
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
