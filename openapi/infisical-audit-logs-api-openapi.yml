                          format: date-time
                        orgId:
                          type: string
                          format: uuid
                          nullable: true
                        projectId:
                          type: string
                          nullable: true
                        projectName:
                          type: string
                          nullable: true
                        event:
                          type: object
                          properties:
                            type:
                              type: string
                            metadata: {}
                          required:
                          - type
                          additionalProperties: false
                        actor:
                          type: object
                          properties:
                            type:
                              type: string
                            metadata: {}
                          required:
                          - type
                          additionalProperties: false
                      required:
                      - id
                      - createdAt
                      - updatedAt
                      - event
                      - actor
                      additionalProperties: false
                required:
