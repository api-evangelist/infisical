openapi: 3.0.3
info:
  title: Infisical Admin Audit Logs API
  description: List of all available APIs that can be consumed
  version: 0.0.1
servers:
- url: https://us.infisical.com
  description: Production server (US)
- url: https://eu.infisical.com
  description: Production server (EU)
- url: http://localhost:8080
  description: Local server
tags:
- name: Audit Logs
paths:
  /api/v1/organization/audit-logs:
    get:
      operationId: listOrganizationAuditLogs
      tags:
      - Audit Logs
      description: Get all audit logs for an organization
      parameters:
      - schema:
          type: string
        in: query
        name: projectId
        required: false
        description: Optionally filter logs by project ID. If not provided, logs from the entire organization will be returned.
      - schema:
          type: string
        in: query
        name: environment
        required: false
        description: The environment to filter logs by. If not provided, logs from all environments will be returned. Note that the projectId parameter must also be provided.
      - schema:
          type: string
          enum:
          - platform
          - kmipClient
          - user
          - service
          - identity
          - scimClient
          - acmeProfile
          - acmeAccount
          - estAccount
          - scepAccount
          - unknownUser
          - gateway
          - relay
          - kmipServer
        in: query
        name: actorType
        required: false
        description: The type of actor to filter audit logs by. Must be provided when the actor parameter targets a non-user actor type (e.g. identity, kmipClient).
      - schema:
          type: string
        in: query
        name: secretPath
        required: false
        description: The path of the secret to query audit logs for. Note that the projectId parameter must also be provided.
      - schema:
          type: string
        in: query
        name: secretKey
        required: false
        description: The key of the secret to query audit logs for. Note that the projectId parameter must also be provided.
      - schema:
          allOf:
          - anyOf:
            - not: {}
            - type: string
          - anyOf:
            - not: {}
            - type: array
