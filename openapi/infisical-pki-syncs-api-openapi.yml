  /api/v1/cert-manager/syncs/{pkiSyncId}/certificates:
    get:
      operationId: listPkiSyncCertificates
      tags:
      - PKI Syncs
      description: List all certificates associated with a PKI Sync.
      parameters:
      - schema:
          type: number
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
      - schema:
          type: number
          minimum: 1
          maximum: 100
          default: 20
        in: query
        name: limit
        required: false
      - schema:
          type: string
          format: uuid
        in: path
        name: pkiSyncId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        pkiSyncId:
                          type: string
                          format: uuid
                        certificateId:
                          type: string
                          format: uuid
                        syncStatus:
                          type: string
                          enum:
                          - pending
                          - syncing
                          - succeeded
                          - failed
                          - running
                        lastSyncMessage:
                          type: string
                          nullable: true
                        lastSyncedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        certificateSerialNumber:
                          type: string
                        certificateCommonName:
                          type: string
                        certificateAltNames:
                          type: string
                        certificateStatus:
                          type: string
                        certificateNotBefore:
                          type: string
                          format: date-time
                        certificateNotAfter:
                          type: string
                          format: date-time
                        certificateRenewBeforeDays:
                          type: number
                          nullable: true
                        certificateRenewalError:
                          type: string
                          nullable: true
                        pkiSyncName:
                          type: string
                        pkiSyncDestination:
                          type: string
                        syncMetadata:
                          type: object
                          properties:
                            isDefault:
                              type: boolean
                          additionalProperties: {}
                          nullable: true
                      required:
                      - id
                      - pkiSyncId
                      - certificateId
                      - syncStatus
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - certificates
                - totalCount
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 400
                  message:
                    type: string
                  error:
                    type: string
                  details: {}
                required:
                - reqId
                - statusCode
                - message
                - error
                additionalProperties: false
        '401':
