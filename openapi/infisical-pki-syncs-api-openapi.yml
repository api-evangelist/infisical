    post:
      operationId: addCertificatesToPkiSync
      tags:
      - PKI Syncs
      description: Add certificates to a PKI Sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                certificateIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
              required:
              - certificateIds
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: pkiSyncId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  addedCertificates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        pkiSyncId:
                          type: string
                          format: uuid
                        certificateId:
                          type: string
                          format: uuid
                        syncStatus:
                          type: string
                          default: pending
                          nullable: true
                        lastSyncMessage:
                          type: string
                          nullable: true
                        lastSyncedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - pkiSyncId
                      - certificateId
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                required:
                - addedCertificates
                additionalProperties: false
