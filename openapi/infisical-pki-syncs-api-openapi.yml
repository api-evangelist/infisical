                            id:
                              type: string
                            name:
                              type: string
                            app:
                              type: string
                            encryptedCredentials:
                              nullable: true
                            orgId:
                              type: string
                              format: uuid
                            method:
                              type: string
                            description:
                              type: string
                              nullable: true
                            version:
                              type: number
                            gatewayId:
                              type: string
                              format: uuid
                              nullable: true
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
